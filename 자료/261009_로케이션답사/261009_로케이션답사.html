<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>로케이션 답사 지도 — 편집</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e2229; --border:#2a2f3a;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#f5b63f; --accent2:#4fb3ff; --danger:#f87171;
    --radius:12px; --shadow:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;}
  #app{position:relative;width:100%;height:100vh;overflow:hidden;}
  #map{position:absolute;inset:0;background:#0b0d11;}
  #map.editing{cursor:crosshair;}
  /* 무료 OSM 타일을 다크테마로 — 키 필요한 CARTO 다크타일이 막혀서 반전필터로 대체(261009) */
  #map .leaflet-tile-pane{ filter:invert(1) hue-rotate(200deg) brightness(.92) contrast(.85) saturate(.7); }
  .leaflet-control-attribution{background:rgba(15,17,21,.7)!important;color:#8892a0!important;font-size:10px;}
  .leaflet-control-attribution a{color:#aab4c4!important;}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important;}

  input,select,textarea,button{font-family:inherit;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    position:absolute;top:0;left:0;height:100%;width:340px;
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;z-index:500;
    transition:transform .25s ease;
  }
  #sidebar.collapsed{transform:translateX(-100%);}
  .sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);}
  .sb-head h1{margin:0 0 2px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .sb-head h1 .cnt{font-size:11px;color:var(--muted);font-weight:600;background:var(--panel2);
    border:1px solid var(--border);border-radius:999px;padding:2px 9px;}
  .sb-head p{margin:0;font-size:11.5px;color:var(--muted);}
  .sbActions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .sbActions button{flex:1 1 calc(50% - 6px);padding:8px 6px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;}
  #btnEditToggle.on{background:var(--accent);color:#1a1405;border-color:var(--accent);}
  #btnSelectMode.on{background:var(--accent2);color:#07131c;border-color:var(--accent2);}

  #editBanner,#bulkBar{margin:10px 16px 0;padding:8px 10px;border-radius:9px;font-size:11.5px;line-height:1.5;}
  #editBanner{background:rgba(245,182,63,.12);border:1px solid rgba(245,182,63,.35);color:var(--accent);}
  #bulkBar{background:rgba(79,179,255,.1);border:1px solid rgba(79,179,255,.35);color:var(--accent2);}
  .bulkActions{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .bulkActions button{padding:5px 9px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;}
  .bulkActions button#bulkDeleteBtn{color:var(--danger);border-color:#5c2a2a;background:rgba(248,113,113,.1);}
  .bulkActions button#bulkDeleteBtn:disabled{opacity:.4;cursor:default;}
  #bulkCount{font-weight:700;color:var(--text);}

  .viewToggle{display:flex;gap:6px;margin:12px 16px 4px;}
  .viewToggle button{flex:1;padding:7px 8px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--muted);font-size:12.5px;cursor:pointer;font-weight:600;}
  .viewToggle button.active{background:var(--accent2);color:#07131c;border-color:var(--accent2);}

  .filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 4px;}
  .chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
    border:1px solid var(--border);background:var(--panel2);color:var(--muted);
    font-size:12px;cursor:pointer;user-select:none;}
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  .chip.on{color:var(--text);border-color:currentColor;}

  #listWrap{flex:1;overflow-y:auto;padding:10px 12px 20px;}
  .emptyState{padding:30px 14px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;}

  .selCheck{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;
    background:var(--panel);color:transparent;}
  .selCheck.on{background:var(--danger);border-color:var(--danger);color:#fff;}

  .locCard{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s;}
  .locCard:hover{border-color:var(--accent2);}
  .locCard.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .locCard.selForDel{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger);}
  .locCard .row1{display:flex;align-items:center;gap:8px;}
  .locCard .badge{width:20px;height:20px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#06131a;}
  .locCard .title{font-size:13.5px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .locCard .cat{font-size:10.5px;color:var(--muted);flex:0 0 auto;}
  .locCard .addr{font-size:11.5px;color:var(--muted);margin-top:4px;padding-left:28px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .locCard .mediaCount{font-size:11px;color:var(--accent2);margin-top:4px;padding-left:28px;}

  .photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 20px;overflow-y:auto;flex:1;}
  .photoCard{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;
    border:1px solid var(--border);aspect-ratio:4/3;background:#000;}
  .photoCard.selForDel{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger);}
  .photoCard img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.85);}
  .photoCard:hover img{filter:brightness(1);}
  .photoCard .pcLabel{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;
    background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11.5px;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .photoCard .pcCount{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);
    border-radius:999px;padding:2px 7px;font-size:10.5px;}
  .photoCard .pcCat{position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:50%;}
  .photoCard .selCheck{position:absolute;top:5px;left:5px;}

  #toggleSidebarBtn{position:absolute;top:14px;left:14px;z-index:600;width:40px;height:40px;
    border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:17px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);}

  /* ---------- Detail Panel ---------- */
  #detailPanel{position:absolute;top:0;right:0;height:100%;width:380px;background:var(--panel);
    border-left:1px solid var(--border);z-index:550;transform:translateX(100%);
    transition:transform .25s ease;display:flex;flex-direction:column;}
  #detailPanel.open{transform:translateX(0);}
  .dp-head{padding:16px;border-bottom:1px solid var(--border);}
  .dp-head .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .dp-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px;}
  .dp-close:hover{color:var(--text);}
  #dpTitleInput{width:100%;background:transparent;border:none;color:var(--text);font-size:16px;
    font-weight:700;padding:3px 0;outline:none;}
  #dpTitleInput:not([readonly]){border-bottom:1px dashed var(--border);}
  #dpTitleInput:not([readonly]):focus{border-color:var(--accent2);}
  .catRow{display:flex;align-items:center;gap:6px;margin-top:8px;}
  #dpCategorySelect{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;font-size:11.5px;padding:4px 6px;flex:1;}
  #dpColorInput{width:34px;height:28px;padding:2px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel2);cursor:pointer;flex:0 0 auto;}
  #dpStreetViewBtn{background:var(--panel2);border:1px solid var(--border);color:var(--accent2);
    border-radius:6px;font-size:11.5px;font-weight:700;padding:4px 8px;cursor:pointer;flex:0 0 auto;white-space:nowrap;}
  #dpGmapsKeyBtn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    border-radius:6px;font-size:13px;padding:4px 7px;cursor:pointer;flex:0 0 auto;}
  .distList{display:flex;flex-direction:column;gap:4px;}
  .distRow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--border);cursor:pointer;font-size:12.5px;}
  .distRow:hover{border-color:var(--accent2);}
  .distRow .dName{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .distRow .dVal{color:var(--accent2);font-weight:700;font-size:11.5px;flex:0 0 auto;}
  #dpCoordHint{font-size:10.5px;color:var(--muted);margin-top:6px;}
  .dp-body{flex:1;overflow-y:auto;padding:16px;}
  .dp-section{margin-bottom:18px;}
  .dp-section h3{margin:0 0 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .dp-section textarea, .dp-section input[type=text]{
    width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:13.5px;line-height:1.55;padding:8px 10px;resize:vertical;outline:none;}
  .dp-section textarea:focus, .dp-section input[type=text]:focus{border-color:var(--accent2);}
  .dp-section textarea[readonly], .dp-section input[readonly]{background:transparent;border-color:transparent;padding:0;}
  .dp-section.sunseeker{background:rgba(245,182,63,.08);border:1px solid rgba(245,182,63,.3);
    border-radius:10px;padding:10px 12px;}
  .dp-section.sunseeker h3{color:var(--accent);}
  .dp-section.sunseeker textarea{background:transparent;border-color:rgba(245,182,63,.25);}
  .mediaHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .mediaHead button{background:var(--panel2);border:1px solid var(--border);color:var(--accent2);
    font-size:11.5px;font-weight:700;border-radius:7px;padding:5px 9px;cursor:pointer;}
  .mediaGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .boxSel{position:absolute;border:1.5px dashed var(--accent2);background:rgba(79,179,255,.14);
    pointer-events:none;z-index:450;border-radius:3px;}
  .catEditBtn{background:var(--panel2);border:1px solid var(--border);color:var(--accent2);
    border-radius:7px;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;}
  .catEditBtn:hover{border-color:var(--accent2);}
  /* 🔴 이름이 «catEditRow» 인 이유 — 상세 패널에 이미 .catRow 가 있다. 같은 이름을 쓰면
     스타일이 섞이고 querySelectorAll 이 남의 줄까지 집는다 (2026-10-09 검사에서 실제로 걸림) */
  .catEditRow{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .catEditRow input[type=text].cIcon{width:46px;text-align:center;flex:0 0 auto;}
  .catEditRow input[type=text]{flex:1;background:var(--panel2);border:1px solid var(--border);
    border-radius:7px;color:var(--text);font-size:12.5px;padding:6px 8px;outline:none;}
  .catEditRow input[type=text]:focus{border-color:var(--accent2);}
  .catEditRow input[type=color]{width:34px;height:30px;padding:2px;border-radius:6px;
    border:1px solid var(--border);background:var(--panel2);cursor:pointer;flex:0 0 auto;}
  .catEditRow .cDel{background:rgba(248,113,113,.1);border:1px solid #5c2a2a;color:var(--danger);
    border-radius:6px;font-size:12px;padding:5px 8px;cursor:pointer;flex:0 0 auto;}
  .catEditRow .cUsed{font-size:10px;color:var(--muted);flex:0 0 auto;min-width:34px;text-align:right;}
  .mediaCell{display:flex;flex-direction:column;gap:4px;}
  .mCaption{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:6px;
    color:var(--text);font-size:11px;padding:4px 6px;outline:none;}
  .mCaption:focus{border-color:var(--accent2);}
  .mCaption[readonly]{background:transparent;border-color:transparent;padding:0 2px;color:var(--muted);}
  .mediaThumb{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;
    border:1px solid var(--border);background:#000;}
  .mediaThumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .mediaThumb .mTypeBadge{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.65);
    border-radius:6px;padding:1px 6px;font-size:10px;}
  .mediaThumb .mRemove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,.7);border:none;color:#fff;font-size:12px;cursor:pointer;line-height:1;}
  .mediaThumb .mPlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:rgba(0,0,0,.2);pointer-events:none;}
  #dpDeleteBtn{width:100%;margin-top:4px;padding:9px;border-radius:9px;border:1px solid #5c2a2a;
    background:rgba(248,113,113,.12);color:var(--danger);font-size:12.5px;font-weight:700;cursor:pointer;}

  /* ---------- Toast ---------- */
  #saveToast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-10px);
    background:#111;border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:999px;
    font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:3000;box-shadow:var(--shadow);}
  #saveToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #saveToast.ok{color:#7ee787;border-color:#1f4a2e;}
  #saveToast.err{color:var(--danger);border-color:#5c2a2a;}

  /* ---------- Lightbox ---------- */
  #lightbox{position:fixed;inset:0;background:rgba(5,6,9,.94);z-index:2000;
    display:none;align-items:center;justify-content:center;flex-direction:column;}
  #lightbox.open{display:flex;}
  .lb-top{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;
    justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;z-index:10;}
  .lb-top .lb-title{color:var(--text);font-weight:700;font-size:14px;}
  .lb-close{background:none;border:none;color:var(--text);font-size:26px;cursor:pointer;line-height:1;}
  .lb-stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;padding:60px 70px;}
  .lb-stage img,.lb-stage video{max-width:100%;max-height:78vh;border-radius:8px;box-shadow:var(--shadow);}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--text);
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lb-nav:hover{background:rgba(255,255,255,.18);}
  .lb-prev{left:14px;} .lb-next{right:14px;}
  .lb-bottom{padding:10px 18px 22px;text-align:center;}
  .lb-caption{font-size:13.5px;color:var(--text);margin-bottom:8px;}
  .lb-sunBadge{display:inline-flex;align-items:center;gap:6px;background:rgba(245,182,63,.15);
    color:var(--accent);border:1px solid rgba(245,182,63,.4);border-radius:999px;padding:3px 10px;font-size:11.5px;margin-bottom:8px;}
  .lb-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:80vw;}
  .lb-dots span{width:6px;height:6px;border-radius:50%;background:#444b58;cursor:pointer;}
  .lb-dots span.on{background:var(--accent);}

  /* ---------- Modals (media picker / export) ---------- */
  .modalOverlay{position:fixed;inset:0;background:rgba(5,6,9,.8);z-index:2500;display:none;
    align-items:center;justify-content:center;padding:20px;}
  .modalOverlay.open{display:flex;}
  .modalBox{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:640px;max-height:84vh;display:flex;flex-direction:column;box-shadow:var(--shadow);}
  .modalHead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center;}
  .modalHead h2{margin:0;font-size:15px;}
  .modalHead button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
  .modalBody{padding:16px 18px;overflow-y:auto;flex:1;}
  .modalFoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
  .modalFoot button{padding:9px 16px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;}
  .modalFoot button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);}

  .pickerGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .pickerCard{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;
    border:2px solid var(--border);background:#000;}
  .pickerCard img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75;}
  .pickerCard:hover img{opacity:1;}
  .pickerCard.selected{border-color:var(--accent);}
  .pickerCard.selected img{opacity:1;}
  .pickerCard .pTick{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;
    justify-content:center;font-size:11px;}
  .pickerCard.selected .pTick{background:var(--accent);color:#1a1405;border-color:var(--accent);}
  .pickerCard .pType{position:absolute;bottom:4px;left:4px;font-size:10px;background:rgba(0,0,0,.6);
    border-radius:5px;padding:0 4px;}
  .pickerCard .pUsed{position:absolute;bottom:4px;right:4px;font-size:9px;background:rgba(0,0,0,.7);
    color:var(--accent2);border-radius:5px;padding:0 4px;}

  .gmapsBox{max-width:420px;}
  .gmapsNote{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0 0 10px;}
  .gmapsInput{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:9px 10px;font-size:13px;outline:none;}
  .gmapsInput:focus{border-color:var(--accent2);}

  .svBox{max-width:960px;width:100%;}
  .svHeadRight{display:flex;align-items:center;gap:10px;}
  .svOpenLink{font-size:11.5px;color:var(--accent2);text-decoration:none;white-space:nowrap;}
  .svOpenLink:hover{text-decoration:underline;}
  .svControls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 18px 12px;
    border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  .svControls input[type=datetime-local]{background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:7px;padding:5px 7px;font-size:12px;}
  .svPathToggle{display:flex;align-items:center;gap:5px;cursor:pointer;}
  #svMovePinBtn{background:var(--panel2);border:1px solid var(--border);color:var(--accent);
    border-radius:7px;font-size:11.5px;font-weight:700;padding:5px 10px;cursor:pointer;white-space:nowrap;}
  #svMovePinBtn:hover{border-color:var(--accent);}
  #svSunReadout{color:var(--accent);font-weight:700;margin-left:auto;}
  #svPanoWrap{position:relative;width:100%;height:60vh;background:#000;}
  #svPano{position:absolute;inset:0;}
  #svOverlay{position:absolute;inset:0;pointer-events:none;}
  #svNoKeyMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;padding:30px;text-align:center;}

  #exportTextarea{width:100%;height:220px;background:#0b0d11;border:1px solid var(--border);
    border-radius:8px;color:#8ee37c;font-family:"SF Mono",Menlo,monospace;font-size:11px;
    padding:10px;resize:vertical;}
  .exportNote{font-size:11.5px;color:var(--muted);margin:8px 0 14px;line-height:1.6;}
  .exportDangerRow{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .exportDangerRow label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);
    color:var(--accent2);font-size:12px;font-weight:700;cursor:pointer;}
  .exportDangerRow button{flex:1;}
  #importFileInput{display:none;}

  /* custom marker */
  .loc-marker{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;

  .reviewColHead{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
    margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .reviewColHead .rcDot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .reviewColHead .rcName{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reviewColHead .rcCount{font-size:10.5px;color:var(--muted);font-weight:600;}
  .reviewGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:40px;}
  .reviewChip{position:relative;border-radius:7px;overflow:hidden;aspect-ratio:4/3;cursor:grab;
    border:1px solid var(--border);background:#000;}
  .reviewChip img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .reviewChip.dragging{opacity:.35;}
  .reviewChip .rcType{position:absolute;top:3px;left:3px;font-size:9px;background:rgba(0,0,0,.65);
    border-radius:4px;padding:0 4px;pointer-events:none;}

const CATEGORIES_DEFAULT = [
  {key:'indoor',  color:'#60a5fa', icon:'🏠'},
  {key:'outdoor', color:'#34d399', icon:'🌳'},

const CATEGORIES_KEY = 'scout_categories_261009';
function loadCategories(){
  /* 발행본은 파일에 박힌 분류를 그대로 쓴다 (보는 사람 브라우저 저장소와 무관) */
  if(typeof SCOUT_PUBLISHED !== 'undefined' && SCOUT_PUBLISHED && Array.isArray(SCOUT_PUBLISHED.categories) && SCOUT_PUBLISHED.categories.length){
    return SCOUT_PUBLISHED.categories.map(c=>({...c}));
  }
  try{
    const raw = localStorage.getItem(CATEGORIES_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length) return arr;
    }
  }catch(e){}
  return CATEGORIES_DEFAULT.map(c=>({...c}));
}
let CATEGORIES = loadCategories();

  try{ localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }catch(e){}
}

  let tt; return function(...args){ clearTimeout(tt); tt = setTimeout(()=>fn.apply(this,args), delay); };

const centerLng = gpsPts.length ? gpsPts.reduce((s,p)=>s+p.lng,0)/gpsPts.length : 126.9780;

  if(tileLayer) map.removeLayer(tileLayer);
  tileLayer = (lang === 'en')
    ? L.tileLayer('https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png?lang=en', {
        attribution: '&copy; OpenStreetMap contributors · Tiles: Wikimedia', maxZoom: 19
      })
    : L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', subdomains: 'abc', maxZoom: 19
      });
  tileLayer.addTo(map);
}

function makeIcon(loc){
  const color = loc.color || catColor(loc.category);
  const sel = selectMode && selectedIds.has(loc.id) ? ' selForDel' : '';
  return L.divIcon({ className:'', html:`<div class="loc-marker${sel}" id="pin-${loc.id}" style="background:${color}">${loc.id}</div>`,
    iconSize:[26,26], iconAnchor:[13,13] });
}
function addMarker(loc){
  const m = L.marker([loc.lat, loc.lng], { icon: makeIcon(loc), draggable:editMode }).addTo(map);
  m.on('click', ()=>{
    if(selectMode){ toggleSelect(loc.id); return; }
    openDetail(loc.id, false);
  });
  /* 🔴 지도에서 바로 지우기 — 오른쪽 클릭 (편집 모드일 때만) */
  m.on('contextmenu', (ev)=>{
    if(ev.originalEvent) ev.originalEvent.preventDefault();
    if(!editMode) return;
    const target = LOCATIONS.find(l=>l.id===loc.id);
    if(!target) return;
    if(!confirm(t('pinRightClickDelete')(target.title || t('noTitle')))) return;
    const mk = markers[target.id]; if(mk) map.removeLayer(mk);
    delete markers[target.id];
    LOCATIONS = LOCATIONS.filter(l=>l.id!==target.id);
    if(currentLocId === target.id){
      currentLocId = null;
      document.getElementById('detailPanel').classList.remove('open');
    }
    selectedIds.delete(target.id);
    applyFilter(); refreshDistancesIfOpen(); updateBulkBar(); saveState();
  });
  m.on('dragend', (ev)=>{
    const ll = ev.target.getLatLng();
    const L2 = LOCATIONS.find(l=>l.id===loc.id);
    if(!L2) return;
    L2.lat = ll.lat; L2.lng = ll.lng;
    if(currentLocId===loc.id) updateCoordHint(L2);
    refreshDistancesIfOpen();
    saveState();
  });
  markers[loc.id] = m;
}
function rebuildAllMarkers(){
  Object.values(markers).forEach(m=> map.removeLayer(m));
  for(const k in markers) delete markers[k];
  LOCATIONS.forEach(addMarker);
  applyFilter();
}
function refreshDraggable(){
  /* 🔴 선택 모드에서는 핀 끌기를 끈다 — 끌기와 「드래그로 범위 선택」이 서로 먹는다 */
  const canDrag = editMode && !selectMode;
  Object.values(markers).forEach(m=> canDrag ? m.dragging.enable() : m.dragging.disable());
  if(selectMode) map.dragging.disable(); else map.dragging.enable();
}

/* ---- 드래그 박스로 여러 핀 한 번에 고르기 (선택 모드에서만) ---- */
let boxSelStart = null, boxSelEl = null;
map.on('mousedown', function(e){
  if(!selectMode) return;
  boxSelStart = e.containerPoint;
  boxSelEl = document.createElement('div');
  boxSelEl.className = 'boxSel';
  boxSelEl.style.left = boxSelStart.x + 'px';
  boxSelEl.style.top = boxSelStart.y + 'px';
  boxSelEl.style.width = '0px'; boxSelEl.style.height = '0px';
  map.getContainer().appendChild(boxSelEl);
});
/* 🔴 mousemove·mouseup 은 «문서»에 건다 — 지도에만 걸면 오른쪽 패널 위에서 손을 뗐을 때
   지도가 그 이벤트를 못 받아 선택이 영영 안 끝나고 사각형만 남는다 (2026-10-09 검사에서 잡음) */
document.addEventListener('mousemove', function(ev){
  if(!boxSelStart || !boxSelEl) return;
  const p = map.mouseEventToContainerPoint(ev);
  boxSelEl.style.left = Math.min(p.x, boxSelStart.x) + 'px';
  boxSelEl.style.top = Math.min(p.y, boxSelStart.y) + 'px';
  boxSelEl.style.width = Math.abs(p.x - boxSelStart.x) + 'px';
  boxSelEl.style.height = Math.abs(p.y - boxSelStart.y) + 'px';
});
document.addEventListener('mouseup', function(ev){
  if(!boxSelStart) return;
  const p = map.mouseEventToContainerPoint(ev);
  const dragged = Math.abs(p.x - boxSelStart.x) > 4 || Math.abs(p.y - boxSelStart.y) > 4;
  if(boxSelEl){ boxSelEl.remove(); boxSelEl = null; }
  const start = boxSelStart; boxSelStart = null;
  if(!dragged) return;                       /* 그냥 클릭한 것 — 선택을 안 건드린다 */
  const bounds = L.latLngBounds(map.containerPointToLatLng(start), map.containerPointToLatLng(p));
  LOCATIONS.forEach(loc=>{
    if(!activeCats.has(loc.category)) return;   /* 필터로 숨긴 것은 안 고른다 */
    if(bounds.contains(L.latLng(loc.lat, loc.lng))) selectedIds.add(loc.id);
  });
  refreshMarkerIcons(); renderList(); renderPhotoGrid(); updateBulkBar();
});
function refreshMarkerIcons(){
  LOCATIONS.forEach(loc=>{ const m = markers[loc.id]; if(m) m.setIcon(makeIcon(loc)); });
}

function createLocationAt(lat, lng, opts){
  opts = opts || {};
  /* 🔴 이름의 숫자는 «핀 번호(id)»와 같아야 한다 — 전에는 「지금 몇 개 있나」로 매겨서
     중간에 하나를 지우면 핀은 1,3,4 인데 이름은 1,2,3 으로 벌어졌다 (2026-10-09 대표 신고) */

function catUsedCount(key){ return LOCATIONS.filter(l=>l.category===key).length; }
function afterCatsChanged(){
  saveCategories();
  const keys = new Set(CATEGORIES.map(c=>c.key));
  /* 🔴 없어진 분류를 쓰던 장소는 첫 분류로 옮긴다 — 안 그러면 필터에서 영영 안 보여
     「핀이 사라졌다」가 된다 (삭제는 막혀 있지만, 옛 데이터를 불러올 때도 생길 수 있다) */
  let orphan = 0;
  LOCATIONS.forEach(l=>{ if(!keys.has(l.category)){ l.category = CATEGORIES[0].key; orphan++; } });
  if(orphan){ saveState(); }
  /* 없어진 분류가 필터에 남아 있으면 지우고, 새로 생긴 것은 기본으로 켠다 */
  Array.from(activeCats).forEach(k=>{ if(!keys.has(k)) activeCats.delete(k); });
  CATEGORIES.forEach(c=>{ if(!activeCats.has(c.key)) activeCats.add(c.key); });
  renderFilters(); buildCategorySelect(); refreshMarkerIcons(); applyFilter();
  if(currentLocId != null) openDetail(currentLocId, false);
}

    row.className = 'catEditRow';
    row.innerHTML = `
      <input type="text" class="cIcon" maxlength="4" value="${escapeHtml(c.icon||'📍')}">
      <input type="text" class="cName" value="${escapeHtml(catLabel(c.key))}" placeholder="${escapeHtml(t('catNamePlaceholder'))}">
      <input type="color" class="cColor" value="${c.color || '#60a5fa'}">
      <span class="cUsed">${used ? t('catInUse')(used) : ''}</span>
      <button class="cDel" type="button">🗑</button>
    `;
    row.querySelector('.cIcon').addEventListener('input', debounce(function(){
      c.icon = this.value || '📍'; afterCatsChanged();
    }, 400));
    row.querySelector('.cName').addEventListener('input', debounce(function(){
      c.label = this.value; afterCatsChanged();
    }, 400));
    row.querySelector('.cColor').addEventListener('input', function(){
      c.color = this.value; afterCatsChanged();
    });
    row.querySelector('.cDel').onclick = ()=>{
      if(CATEGORIES.length <= 1){ flashError(t('catDeleteLast')); return; }

      afterCatsChanged(); renderCatRows(); flashSaved();
    };
    wrap.appendChild(row);
  });

function updateCoordHint(loc){

}
function haversineMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}
function formatDist(m){ return m<1000 ? Math.round(m)+'m' : (m/1000).toFixed(2)+'km'; }
function renderDpDistances(loc){
  const wrap = document.getElementById('dpDistList');
  const others = LOCATIONS.filter(l=>l.id!==loc.id)
    .map(l=>({l, d: haversineMeters(loc.lat,loc.lng,l.lat,l.lng)}))
    .sort((a,b)=>a.d-b.d);
  if(others.length===0){ wrap.innerHTML = `<div class="emptyState" style="padding:8px 0;">${t('noOtherSpots')}</div>`; return; }
  wrap.innerHTML = others.map(o=>`
    <div class="distRow" data-id="${o.l.id}">
      <span>${catIcon(o.l.category)}</span>
      <span class="dName">${escapeHtml(o.l.title||t('noTitle'))}</span>
      <span class="dVal">${formatDist(o.d)}</span>
    </div>`).join('');
  wrap.querySelectorAll('.distRow').forEach(row=>{
    row.onclick = ()=> openDetail(Number(row.dataset.id), true);
  });
}
function refreshDistancesIfOpen(){
  if(currentLocId==null) return;
  const loc = LOCATIONS.find(l=>l.id===currentLocId);
  if(loc) renderDpDistances(loc);
}
function openDetail(locId, flyTo){
  const loc = LOCATIONS.find(l=>l.id===locId);
  if(!loc) return;
  currentLocId = locId;
  renderList();
  if(flyTo) map.flyTo([loc.lat, loc.lng], Math.max(map.getZoom(),17), { duration:.5 });

  document.getElementById('dpTitleInput').value = loc.title || '';
  document.getElementById('dpTitleInput').readOnly = !editMode;
  buildCategorySelect();
  document.getElementById('dpCategorySelect').value = loc.category;
  document.getElementById('dpCategorySelect').disabled = !editMode;
  document.getElementById('dpColorInput').value = loc.color || catColor(loc.category);
  document.getElementById('dpColorInput').disabled = !editMode;
  document.getElementById('dpAddressInput').value = loc.address || '';
  document.getElementById('dpAddressInput').readOnly = !editMode;
  document.getElementById('dpNotesInput').value = loc.notes || '';
  document.getElementById('dpNotesInput').readOnly = !editMode;

/* ---- 구글 지도 JS API 동적 로드 (키가 있을 때만) ---- */
let gmapsLoadPromise = null;
function loadGoogleMaps(key){
  if(window.google && window.google.maps) return Promise.resolve(window.google);
  if(gmapsLoadPromise) return gmapsLoadPromise;
  gmapsLoadPromise = new Promise((resolve, reject)=>{
    window.__gmapsReady = ()=> resolve(window.google);
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=__gmapsReady`;
    s.onerror = ()=>{ gmapsLoadPromise = null; reject(new Error('load fail')); };
    document.head.appendChild(s);
  });
  return gmapsLoadPromise;
}

/* ---- 태양 위치 (SunCalc, 키 불필요) ---- */
function sunPosDeg(lat,lng,date){
  const p = SunCalc.getPosition(date, lat, lng);
  return { az: (p.azimuth*180/Math.PI + 180 + 360) % 360, alt: p.altitude*180/Math.PI };
}
function fovForZoom(z){
  if(!Number.isFinite(z)) z = 1;
  return Math.min(180, 180 / Math.pow(1.5, z));
}
function getSelectedDateTime(){
  const v = document.getElementById('svDateTime').value;
  return v ? new Date(v) : new Date();
}
function toLocalDatetimeInputValue(d){
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let svPanorama = null, svLoc = null, svResizeBound = false;
function drawSunOverlay(){
  if(!svPanorama || !svLoc) return;
  const wrap = document.getElementById('svPanoWrap');
  const canvas = document.getElementById('svOverlay');
  const box = wrap.getBoundingClientRect();
  if(!box.width || !box.height) return; // 모달이 아직 화면에 자리잡기 전 — 곧 재시도로 다시 그려짐
  canvas.width = box.width; canvas.height = box.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const pov = svPanorama.getPov() || {};
  const heading = Number.isFinite(pov.heading) ? pov.heading : 0;
  const pitch = Number.isFinite(pov.pitch) ? pov.pitch : 0;
  const fovH = fovForZoom(svPanorama.getZoom());
  const fovV = fovH * (canvas.height / Math.max(canvas.width,1));

  function project(az, alt){
    const dAz = ((az - heading + 540) % 360) - 180;
    const x = canvas.width/2 + (dAz/(fovH/2)) * (canvas.width/2);
    const dAlt = alt - pitch;
    const y = canvas.height/2 - (dAlt/(fovV/2)) * (canvas.height/2);
    return { x, y, inView: Math.abs(dAz) <= fovH/2 + 8 };
  }

  const dateVal = getSelectedDateTime();
  if(document.getElementById('svShowPath').checked){
    const times = SunCalc.getTimes(dateVal, svLoc.lat, svLoc.lng);
    const start = (times.sunrise instanceof Date && !isNaN(times.sunrise)) ? times.sunrise.getTime()-30*60000 : dateVal.getTime()-6*3600000;
    const end = (times.sunset instanceof Date && !isNaN(times.sunset)) ? times.sunset.getTime()+30*60000 : dateVal.getTime()+6*3600000;
    ctx.beginPath();
    let started = false, lastInView = false;
    for(let tms=start; tms<=end; tms+=10*60000){
      const { az, alt } = sunPosDeg(svLoc.lat, svLoc.lng, new Date(tms));
      if(alt < -4) continue;
      const p = project(az, alt);
      if(!started || !lastInView && !p.inView){ ctx.moveTo(p.x,p.y); started = true; }
      else ctx.lineTo(p.x,p.y);
      lastInView = p.inView;
    }
    ctx.strokeStyle = 'rgba(245,182,63,.85)'; ctx.lineWidth = 2; ctx.stroke();
  }

  const cur = sunPosDeg(svLoc.lat, svLoc.lng, dateVal);
  const p = project(cur.az, cur.alt);
  if(cur.alt > -4){
    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI*2);
    ctx.fillStyle = '#ffd56b'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  const belowTxt = cur.alt < 0 ? ` (${t('belowHorizon')})` : '';
  document.getElementById('svSunReadout').textContent =
    `☀️ ${t('altitude')} ${cur.alt.toFixed(0)}° · ${t('azimuth')} ${cur.az.toFixed(0)}°${belowTxt}`;
}

async function openStreetViewModal(loc){
  svLoc = loc;
  document.getElementById('svModalTitle').textContent = loc.title || t('noTitle');
  document.getElementById('svOpenNewTab').textContent = t('svOpenNewTab');
  document.getElementById('svOpenNewTab').href = `https://www.google.com/maps?layer=c&cbll=${loc.lat},${loc.lng}`;
  document.getElementById('svShowPathLabel').textContent = t('svShowPathLabel');
  document.getElementById('svDateTime').value = toLocalDatetimeInputValue(new Date());
  document.getElementById('svNoKeyMsg').style.display = 'none';
  document.getElementById('svModal').classList.add('open');

  const key = getGmapsKey();
  if(!key){
    document.getElementById('svModal').classList.remove('open');
    openGmapsKeyModal();
    return;
  }
  try{ await loadGoogleMaps(key); }
  catch(e){
    document.getElementById('svNoKeyMsg').textContent = t('gmapsLoadFail');
    document.getElementById('svNoKeyMsg').style.display = 'flex';
    return;
  }
  if(!svPanorama){
    svPanorama = new google.maps.StreetViewPanorama(document.getElementById('svPano'), {
      position: { lat: loc.lat, lng: loc.lng }, pov: { heading: 0, pitch: 0 }, zoom: 1,
      addressControl: false, fullscreenControl: false, motionTracking: false, motionTrackingControl: false
    });
    svPanorama.addListener('pov_changed', drawSunOverlay);
    svPanorama.addListener('zoom_changed', drawSunOverlay);
    svPanorama.addListener('status_changed', ()=>{
      if(svPanorama.getStatus() !== 'OK'){
        document.getElementById('svNoKeyMsg').textContent = t('noStreetView');
        document.getElementById('svNoKeyMsg').style.display = 'flex';
      } else {
        document.getElementById('svNoKeyMsg').style.display = 'none';
        drawSunOverlay();
      }
    });
  } else {
    svPanorama.setPosition({ lat: loc.lat, lng: loc.lng });
  }
  if(!svResizeBound){
    window.addEventListener('resize', ()=>{ if(document.getElementById('svModal').classList.contains('open')) drawSunOverlay(); });
    svResizeBound = true;
  }
  // 🔴 로드뷰가 뜨는 속도가 매번 달라 단 한 번의 타이머로는 못 믿는다 — 몇 번 더 다시 그려서 맞춘다
  [100, 400, 900, 1800].forEach(ms => setTimeout(drawSunOverlay, ms));
}

function renderDpMedia(loc){

function renderMediaGroup_(grid, loc, indices){
  grid.innerHTML = '';
  indices.forEach(idx=>{
    const m = loc.media[idx];
    const badge = t('typeBadge')[m.type] || m.type;
    const cell = document.createElement('div');
    cell.className = 'mediaCell';
    const card = document.createElement('div');
    card.className = 'mediaThumb';
    card.innerHTML = `
      <img src="${thumbFor(m)}" alt="">

    card.onclick = ()=> openLightbox(loc.id, idx);
    if(editMode){
      card.querySelector('.mRemove').onclick = (ev)=>{
        ev.stopPropagation();
        loc.media.splice(idx,1);
        renderDpMedia(loc); renderList(); renderPhotoGrid(); saveState();
      };
      if(m.type !== 'video'){
        const b = card.querySelector('.mTypeBadge');
        b.style.cursor = 'pointer'; b.title = t('typeToggleTitle');
        b.onclick = (ev)=>{
          ev.stopPropagation();
          m.type = (m.type==='sunseeker') ? 'image' : 'sunseeker';
          renderDpMedia(loc); saveState();
        };
      }
    }
    cell.appendChild(card);

    const cap = document.createElement('input');
    cap.type = 'text'; cap.className = 'mCaption';
    cap.value = m.caption || '';
    cap.placeholder = t('captionPlaceholder');
    cap.readOnly = !editMode;
    cap.addEventListener('input', debounce(function(){

    grid.appendChild(cell);
  });

  btn.textContent = t('btnUnsorted')(arr.length);
}

function sanitizeFilename(name){
  return name.replace(/[^\w.\-가-힣]/g, '_');
}

/* ---- IndexedDB: 폴더 핸들 저장(세션 넘어 재사용) ---- */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('scout_fs_261009', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('handles');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise(res=>{
      const r = db.transaction('handles','readonly').objectStore('handles').get(key);
      r.onsuccess = ()=> res(r.result || null);
      r.onerror = ()=> res(null);
    });
  }catch(e){ return null; }
}
async function idbSet(key, val){
  try{
    const db = await idbOpen();
    await new Promise(res=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(val, key);
      tx.oncomplete = ()=> res(true);
      tx.onerror = ()=> res(false);
    });
  }catch(e){}
}

/* 🔴 폴더 권한은 «페이지를 열 때 미리» 메모리에 올려 둔다 (2026-10-09 대표 신고로 고침).
   왜 — 브라우저는 「방금 사람이 누른 직후」에만 폴더 창을 띄워준다. 버튼을 누른 «뒤에»
   저장소를 뒤지느라(await) 시간이 가면 그 «직후»가 끊겨서 창이 조용히 막히고,
   화면에는 「폴더 선택이 취소됐다」만 뜬다. 그래서 «누르기 전에» 미리 알아 둔다. */
let mediaDirHandle = null;
let mediaDirReady = false;     /* 동기적으로 판단해야 해서 따로 들고 있는다 */
(async function preloadMediaDir(){
  if(PUBLISHED) return;
  try{
    const h = await idbGet('mediaDir');
    if(h){
      mediaDirHandle = h;
      mediaDirReady = (await h.queryPermission({mode:'readwrite'})) === 'granted';
    }
  }catch(e){}
})();

async function ensureMediaDirHandle(){
  if(!window.showDirectoryPicker){ alert(t('noFsApi')); return null; }
  if(mediaDirHandle){
    try{
      if(await mediaDirHandle.queryPermission({mode:'readwrite'}) === 'granted') return mediaDirHandle;
      if(await mediaDirHandle.requestPermission({mode:'readwrite'}) === 'granted') return mediaDirHandle;
    }catch(e){ mediaDirHandle = null; }
  }
  const saved = await idbGet('mediaDir');
  if(saved){
    try{
      let perm = await saved.queryPermission({mode:'readwrite'});
      if(perm !== 'granted') perm = await saved.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){ mediaDirHandle = saved; return saved; }
    }catch(e){}
  }
  try{
    const handle = await window.showDirectoryPicker({ id:'scoutMediaDir261009', mode:'readwrite' });
    mediaDirHandle = handle;
    await idbSet('mediaDir', handle);
    return handle;
  }catch(e){ return null; }
}
async function writeFileToDir(dirHandle, subfolder, filename, blobOrFile){
  const sub = await dirHandle.getDirectoryHandle(subfolder, { create:true });
  const fh = await sub.getFileHandle(filename, { create:true });
  const w = await fh.createWritable();
  await w.write(blobOrFile);
  await w.close();
}

function makeImageThumbnailBlob(file){
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const maxW = 360;
      const scale = Math.min(1, maxW/img.width);
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(b=>{ URL.revokeObjectURL(url); resolve(b); }, 'image/jpeg', 0.82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
function makeVideoThumbnailBlob(file){
  return new Promise((resolve)=>{
    const video = document.createElement('video');
    video.preload = 'metadata'; video.muted = true; video.playsInline = true;
    const url = URL.createObjectURL(file);
    let done = false;
    const finish = (b)=>{ if(done) return; done = true; URL.revokeObjectURL(url); resolve(b); };
    video.addEventListener('loadeddata', ()=>{ video.currentTime = Math.min(1, (video.duration||2)/2); });
    video.addEventListener('seeked', ()=>{
      try{
        const w = 360, h = Math.round(360 * ((video.videoHeight/video.videoWidth)||0.75));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(video,0,0,w,h);
        canvas.toBlob(b=> finish(b), 'image/jpeg', 0.8);
      }catch(e){ finish(null); }
    });
    video.addEventListener('error', ()=> finish(null));
    setTimeout(()=> finish(null), 6000);
    video.src = url;
  });
}

function setUploadProgress(i, n, name){
  document.getElementById('upProgressFill').style.width = Math.round(i/n*100)+'%';
  document.getElementById('upProgressText').textContent = t('upProgressText')(i, n, name);
}

async function handleBulkUpload(fileList){
  const files = Array.from(fileList);
  if(!files.length) return;
  /* 🔴 여기서는 폴더 창을 «띄우지 않는다» — 파일 선택을 거치며 「방금 누름」이 끊겨 막힌다.
     폴더는 버튼 단계에서 이미 연결돼 있어야 한다. */
  const dir = mediaDirReady ? mediaDirHandle : null;
  if(!dir){ flashError(t('folderPickCancelled')); setBackupStatus('off'); return; }

  document.getElementById('uploadProgressTitle').textContent = t('uploadProgressTitle');
  document.getElementById('upProgressFill').style.width = '0%';
  document.getElementById('uploadProgressModal').classList.add('open');

  const newEntries = []; // {file,type,lat,lng}
  for(let i=0;i<files.length;i++){
    const f = files[i];
    setUploadProgress(i, files.length, f.name);
    const isVideo = f.type.startsWith('video/');
    const safeName = `up_${Date.now()}_${i}_${sanitizeFilename(f.name)}`;
    let lat = null, lng = null;
    if(!isVideo){
      try{ const gps = await exifr.gps(f); if(gps){ lat = gps.latitude; lng = gps.longitude; } }catch(e){}
    }
    try{
      await writeFileToDir(dir, '원본', safeName, f);
      const thumbBlob = isVideo ? await makeVideoThumbnailBlob(f) : await makeImageThumbnailBlob(f);
      const thumbName = safeName.replace(/\.[^.]+$/,'') + '.jpg';
      if(thumbBlob) await writeFileToDir(dir, '썸네일', thumbName, thumbBlob);
      newEntries.push({ file: safeName, type: isVideo?'video':'image', lat, lng });
    }catch(e){ /* 한 파일 실패해도 나머지는 계속 */ }
  }
  setUploadProgress(files.length, files.length, '');
  const extra = loadMediaExtra().concat(newEntries);
  saveMediaExtra(extra);

  document.getElementById('uploadProgressModal').classList.remove('open');
  const affectedIds = clusterAndAssign(newEntries);
  flashSaved();
  openReviewModal(affectedIds);
}

/* ---- GPS 자동분류: 기존 핀 근처면 그 핀에, 아니면 새로운 핀끼리 묶기, GPS 없으면 미분류 ---- */
function clusterAndAssign(newEntries){
  const affected = new Set();
  const withGps = [];
  const unsorted = loadUnsorted();

  newEntries.forEach(e=>{
    if(e.lat==null || e.lng==null){ unsorted.push(e); return; }
    let best = null, bestD = Infinity;
    LOCATIONS.forEach(loc=>{
      const d = haversineMeters(e.lat,e.lng, loc.lat, loc.lng);
      if(d < bestD){ bestD = d; best = loc; }
    });
    if(best && bestD <= CLUSTER_RADIUS_M){
      best.media.push({ type: e.type, url: mediaFullPath(e.file), caption:'' });
      affected.add(best.id);
    } else {
      withGps.push(e);
    }
  });

  // 남은 것들끼리 거리기준으로 묶기 (간단한 그리디 클러스터링)
  const clusters = [];
  withGps.forEach(e=>{
    let joined = null;
    for(const c of clusters){
      if(haversineMeters(e.lat,e.lng, c.lat, c.lng) <= CLUSTER_RADIUS_M){ joined = c; break; }
    }
    if(joined){
      joined.items.push(e);
      joined.lat = joined.items.reduce((s,x)=>s+x.lat,0)/joined.items.length;
      joined.lng = joined.items.reduce((s,x)=>s+x.lng,0)/joined.items.length;
    } else {
      clusters.push({ lat:e.lat, lng:e.lng, items:[e] });
    }
  });
  let clusterN = 1;
  clusters.forEach(c=>{
    const media = c.items.map(e=>({ type:e.type, url:mediaFullPath(e.file), caption:'' }));
    const loc = createLocationAt(c.lat, c.lng, { title: t('newClusterTitle')(clusterN++), media });
    affected.add(loc.id);
  });

  saveUnsorted(unsorted);
  applyFilter(); saveState(); refreshDistancesIfOpen();
  return affected;
}

/* ---- 업로드 결과 리뷰 모달: 드래그로 자유 이동 ---- */
let dragPayload = null; // {from:'loc'|'unsorted', locId, idx}
function openReviewModal(affectedIds){
  renderReviewModal(affectedIds || null);
  document.getElementById('reviewModal').classList.add('open');
}
function reviewColumnsData(affectedIds){
  const unsorted = loadUnsorted();
  const locs = affectedIds
    ? LOCATIONS.filter(l=> affectedIds.has(l.id))
    : LOCATIONS.filter(l=> l.media.length>0);
  return { unsorted, locs };
}
function renderReviewModal(affectedIds){
  const wrap = document.getElementById('reviewCols');
  wrap.innerHTML = '';
  const { unsorted, locs } = reviewColumnsData(affectedIds);

  // 미분류 칸
  const unsortedCol = document.createElement('div');
  unsortedCol.className = 'reviewCol unsorted';
  unsortedCol.dataset.target = 'unsorted';
  unsortedCol.innerHTML = `<div class="reviewColHead"><span class="rcName">${t('unsortedColTitle')}</span><span class="rcCount">${unsorted.length}</span></div>
    <div class="reviewGrid" data-grid="unsorted"></div>`;
  wrap.appendChild(unsortedCol);
  const uGrid = unsortedCol.querySelector('.reviewGrid');
  unsorted.forEach((e,idx)=>{
    uGrid.appendChild(makeReviewChip(e.type, mediaThumbPath(e.file), 'unsorted', null, idx));
  });
  bindDropzone(unsortedCol);

  locs.forEach(loc=>{
    const col = document.createElement('div');
    col.className = 'reviewCol';
    col.dataset.target = 'loc'; col.dataset.locId = loc.id;
    const color = loc.color || catColor(loc.category);
    col.innerHTML = `<div class="reviewColHead"><span class="rcDot" style="background:${color}"></span>
      <span class="rcName">${escapeHtml(loc.title||t('noTitle'))}</span><span class="rcCount">${loc.media.length}</span></div>
      <div class="reviewGrid" data-grid="${loc.id}"></div>`;
    wrap.appendChild(col);
    const grid = col.querySelector('.reviewGrid');
    loc.media.forEach((m,idx)=>{
      grid.appendChild(makeReviewChip(m.type, thumbFor(m), 'loc', loc.id, idx));
    });
    bindDropzone(col);
  });
}
function makeReviewChip(type, thumbSrc, from, locId, idx){
  const chip = document.createElement('div');
  chip.className = 'reviewChip';
  chip.draggable = true;
  chip.innerHTML = `<img src="${thumbSrc}" alt=""><span class="rcType">${type==='video'?'🎬':(type==='sunseeker'?'☀️':'📷')}</span>`;
  chip.addEventListener('dragstart', (ev)=>{
    dragPayload = { from, locId, idx };
    chip.classList.add('dragging');
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', 'x');
  });
  chip.addEventListener('dragend', ()=> chip.classList.remove('dragging'));
  return chip;
}
function bindDropzone(col){
  col.addEventListener('dragover', (ev)=>{ ev.preventDefault(); col.classList.add('dragover'); });
  col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
  col.addEventListener('drop', (ev)=>{
    ev.preventDefault();
    col.classList.remove('dragover');
    if(!dragPayload) return;
    moveReviewItem(dragPayload, col.dataset.target==='unsorted' ? {target:'unsorted'} : {target:'loc', locId:Number(col.dataset.locId)});
    dragPayload = null;
  });
}
function moveReviewItem(src, dst){
  // 꺼내기
  let item = null, itemKind = null;
  if(src.from === 'unsorted'){
    const uns = loadUnsorted();
    item = uns[src.idx]; itemKind = 'raw';
    if(!item) return;
    uns.splice(src.idx,1); saveUnsorted(uns);
  } else {
    const loc = LOCATIONS.find(l=>l.id===src.locId);
    if(!loc) return;
    item = loc.media[src.idx]; itemKind = 'media';
    if(!item) return;
    loc.media.splice(src.idx,1);
  }
  // 넣기
  if(dst.target === 'unsorted'){
    const uns = loadUnsorted();
    if(itemKind === 'media'){
      const fname = item.url.split('/').pop();
      uns.push({ file:fname, type:item.type==='sunseeker'?'image':item.type, lat:null, lng:null });
    } else {
      uns.push(item);
    }
    saveUnsorted(uns);
  } else {
    const loc = LOCATIONS.find(l=>l.id===dst.locId);
    if(!loc) return;
    if(itemKind === 'raw'){
      loc.media.push({ type: item.type, url: mediaFullPath(item.file), caption:'' });
    } else {
      loc.media.push(item);
    }
  }
  renderReviewModal(null);
  renderList(); renderPhotoGrid(); refreshDistancesIfOpen();
  if(currentLocId!=null) renderDpMedia(LOCATIONS.find(l=>l.id===currentLocId) || {media:[]});
  saveState();
}

/* =========================================================
   9-B. 드라이브 폴더 자동 백업 — 크롬 저장소가 날아가도 살아남게
   🔴 브라우저는 아무 폴더에나 못 쓴다. 사진 업로드 때 받아둔 «그 폴더 권한»을 그대로 쓴다.
   🔴 권한이 끊기면 «조용히» 넘어가지 않는다 — 화면에 꺼졌다고 띄우고 다시 연결할 단추를 준다.
   ========================================================= */
const BACKUP_FILENAME = '_백업_데이터.js';
let backupTimer = null, backupBusy = false;

function setBackupStatus(kind, extra){
  const el = document.getElementById('backupStatus');
  if(!el) return;
  if(kind === 'ok'){
    el.innerHTML = `💾 드라이브 백업됨 · ${extra}`;
    el.style.color = '#7ee787';
  } else if(kind === 'off'){
    el.innerHTML = `⚠ 자동 백업 꺼짐 — <button id="btnBackupConnect" class="catEditBtn">폴더 연결</button>`;
    el.style.color = 'var(--accent)';
    const b = document.getElementById('btnBackupConnect');
    if(b) b.onclick = ()=> connectMediaFolder();
  } else {
    el.innerHTML = '⚠ 백업 실패 — 폴더 권한을 다시 확인해주세요';
    el.style.color = 'var(--danger)';
  }
}
function scheduleBackup(){
  if(PUBLISHED) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(doBackup, 2500);   /* 손이 멈춘 뒤 한 번만 */
}
async function doBackup(){
  if(PUBLISHED || backupBusy) return;
  backupBusy = true;
  try{
    let dir = mediaDirHandle;
    if(!dir) dir = await idbGet('mediaDir');
    if(!dir){ setBackupStatus('off'); return; }
    /* 🔴 권한 «재요청»은 사람이 누를 때만 된다 — 여기서는 확인만 하고, 없으면 단추를 띄운다 */
    if(await dir.queryPermission({mode:'readwrite'}) !== 'granted'){ setBackupStatus('off'); return; }
    mediaDirHandle = dir;
    const bundle = {
      savedAt: new Date().toISOString(),
      locations: LOCATIONS,
      categories: CATEGORIES,
      gmapsKey: (localStorage.getItem(GMAPS_KEY_STORAGE) || '')
    };
    const fh = await dir.getFileHandle(BACKUP_FILENAME, { create:true });
    const w = await fh.createWritable();
    await w.write('const LOCATIONS = ' + JSON.stringify(bundle, null, 2) + ';');
    await w.close();
    const d = new Date();
    setBackupStatus('ok', `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);
  }catch(e){
    setBackupStatus('fail');
  }finally{ backupBusy = false; }
}
if(!PUBLISHED) setTimeout(doBackup, 1200);   /* 열자마자 한 번 — 상태를 바로 보여준다 */

/* 🔴 업로드는 «두 걸음»이다 — ①폴더 연결 ②파일 고르기.
   한 번에 하면 브라우저가 폴더 창을 막는다(위 preloadMediaDir 주석 참고).
   폴더가 이미 연결돼 있으면 ①을 건너뛰고 바로 파일 창이 열린다. */
function connectMediaFolder(onDone){
  /* 🔴 이 함수는 «클릭 핸들러 안에서 곧바로» 불려야 한다 — 앞에 await 를 두면 안 된다 */
  let p;
  try{
    p = mediaDirHandle
      ? mediaDirHandle.requestPermission({mode:'readwrite'})
      : (window.showDirectoryPicker
          ? window.showDirectoryPicker({ id:'scoutMediaDir261009', mode:'readwrite' })
          : Promise.reject(new Error('no-fs-api')));
  }catch(e){ p = Promise.reject(e); }

  p.then(async (res)=>{
    if(typeof res === 'string'){
      if(res !== 'granted'){ setBackupStatus('off'); flashError(t('folderPickCancelled')); return; }
    } else if(res){
      /* 🔴 폴더를 «잘못 고르면» 사진이 엉뚱한 데 저장돼 화면에 안 보인다 (2026-10-09 실제로 겪음 —
         대표님이 원본이 있던 다운로드 폴더를 고르셨고, 업로드가 조용히 실패했다).
         이 페이지는 사진을 «이 폴더 이름»으로만 찾으므로, 이름이 다르면 받지 않는다. */
      if(res.name !== MEDIA_FOLDER.replace(/\/$/,'')){
        alert(t('folderWrong')(res.name));
        setBackupStatus('off');
        return;
      }
      mediaDirHandle = res;
      await idbSet('mediaDir', res);
    }
    mediaDirReady = true;
    doBackup();
    if(onDone) onDone();
  }).catch((e)=>{
    if(String(e && e.message) === 'no-fs-api'){ alert(t('noFsApi')); return; }
    setBackupStatus('off');
    flashError(t('folderPickCancelled'));
  });
}
document.getElementById('btnBulkUpload').onclick = ()=>{
  if(mediaDirReady){ document.getElementById('bulkUploadInput').click(); return; }
  connectMediaFolder(()=>{
    setBackupStatus('ok', '연결됨');
    alert(t('folderConnected'));
  });
};
document.getElementById('bulkUploadInput').addEventListener('change', (e)=>{
  const files = e.target.files;
  if(files && files.length) handleBulkUpload(files);
  e.target.value = '';
});
document.getElementById('btnUnsorted').onclick = ()=> openReviewModal(null);
document.getElementById('reviewClose').onclick = ()=> document.getElementById('reviewModal').classList.remove('open');
document.getElementById('reviewDone').onclick = ()=> document.getElementById('reviewModal').classList.remove('open');

/* =========================================================
   10. 초기 렌더
   ========================================================= */
saveUnsorted(loadUnsorted());
applyLang();

/* 🔴 발행본이면 «편집에 관한 것»을 전부 숨긴다 — 보는 사람은 누르면 안 되고, 눌러도 저장이 안 된다.
   🔴 스트리트뷰는 «새 탭 구글맵»으로 돌린다 — API 키를 공개 페이지에 넣으면 남이 그 키를 써서
      대표님 계정에 요금이 붙을 수 있다. 공개본에는 절대 키를 싣지 않는다. */
if(PUBLISHED){
  ['btnEditToggle','btnSelectMode','btnExport','btnBulkUpload','btnUnsorted',
   'btnEditCats','editBanner','bulkBar','uploadFolderHint','dpGmapsKeyBtn','svMovePinBtn']
    .forEach(id=>{ const el = document.getElementById(id); if(el) el.style.display = 'none'; });
  document.getElementById('map').classList.remove('editing');
  /* 🔴 키가 같이 발행됐으면 로드뷰·태양궤적을 그대로 쓴다(대표 확정 B안).
     키가 없으면 구글맵 새 탭으로 돌린다 — 빈 화면이 뜨면 안 되니까. */
  if(!(PUBLISHED.gmapsKey)){
    document.getElementById('dpStreetViewBtn').onclick = ()=>{
      const loc = LOCATIONS.find(l=>l.id===currentLocId); if(!loc) return;
      window.open(`https://www.google.com/maps?layer=c&cbll=${loc.lat},${loc.lng}`, '_blank', 'noopener');
    };
  }
  if(PUBLISHED.title){
    document.getElementById('appTitleText').textContent = PUBLISHED.title;
    document.title = PUBLISHED.title;
  }
  if(PUBLISHED.subtitle) document.getElementById('appSubtitleText').textContent = PUBLISHED.subtitle;
  /* 지도를 모든 핀이 들어오게 맞춘다 — 보는 사람은 어디를 봐야 할지 모른다 */
  if(LOCATIONS.length){
    const b = L.latLngBounds(LOCATIONS.map(l=>[l.lat, l.lng]));
    map.fitBounds(b, { padding:[60,60], maxZoom:18 });
  }
}
