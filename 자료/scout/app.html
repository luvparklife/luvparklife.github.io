<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>로케이션 답사 지도 — 편집</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e2229; --border:#2a2f3a;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#f5b63f; --accent2:#4fb3ff; --danger:#f87171;
    --radius:12px; --shadow:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;}
  #app{position:relative;width:100%;height:100vh;overflow:hidden;}
  #map{position:absolute;inset:0;background:#0b0d11;}
  #map.editing{cursor:crosshair;}
  /* 무료 OSM 타일을 다크테마로 — 키 필요한 CARTO 다크타일이 막혀서 반전필터로 대체(261009) */
  #map .leaflet-tile-pane{ filter:invert(1) hue-rotate(200deg) brightness(.92) contrast(.85) saturate(.7); }
  #map.satellite .leaflet-tile-pane{ filter:none; }
  .leaflet-control-attribution{background:rgba(15,17,21,.7)!important;color:#8892a0!important;font-size:10px;}
  .leaflet-control-attribution a{color:#aab4c4!important;}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important;}

  input,select,textarea,button{font-family:inherit;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    position:absolute;top:0;left:0;height:100%;width:340px;
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;z-index:500;
    transition:transform .25s ease;
  }
  #sidebar.collapsed{transform:translateX(-100%);}
  .sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);}
  .sb-head h1{margin:0 0 2px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .sb-head h1 .cnt{font-size:11px;color:var(--muted);font-weight:600;background:var(--panel2);
    border:1px solid var(--border);border-radius:999px;padding:2px 9px;}
  .sb-head p{margin:0;font-size:11.5px;color:var(--muted);}
  .sbActions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .sbActions button{flex:1 1 calc(50% - 6px);padding:8px 6px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;}
  #btnEditToggle.on{background:var(--accent);color:#1a1405;border-color:var(--accent);}
  #btnSelectMode.on{background:var(--accent2);color:#07131c;border-color:var(--accent2);}

  #editBanner,#bulkBar{margin:10px 16px 0;padding:8px 10px;border-radius:9px;font-size:11.5px;line-height:1.5;}
  #editBanner{background:rgba(245,182,63,.12);border:1px solid rgba(245,182,63,.35);color:var(--accent);}
  #bulkBar{background:rgba(79,179,255,.1);border:1px solid rgba(79,179,255,.35);color:var(--accent2);}
  .bulkActions{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .bulkActions button{padding:5px 9px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;}
  .bulkActions button#bulkDeleteBtn{color:var(--danger);border-color:#5c2a2a;background:rgba(248,113,113,.1);}
  .bulkActions button#bulkDeleteBtn:disabled{opacity:.4;cursor:default;}
  #bulkCount{font-weight:700;color:var(--text);}

  .viewToggle{display:flex;gap:6px;margin:12px 16px 4px;}
  .viewToggle button{flex:1;padding:7px 8px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--muted);font-size:12.5px;cursor:pointer;font-weight:600;}
  .viewToggle button.active{background:var(--accent2);color:#07131c;border-color:var(--accent2);}

  .filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 4px;}
  .chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
    border:1px solid var(--border);background:var(--panel2);color:var(--muted);
    font-size:12px;cursor:pointer;user-select:none;}
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  .chip.on{color:var(--text);border-color:currentColor;}

  #listWrap{flex:1;overflow-y:auto;padding:10px 12px 20px;}
  .emptyState{padding:30px 14px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;}

  .selCheck{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;
    background:var(--panel);color:transparent;}
  .selCheck.on{background:var(--danger);border-color:var(--danger);color:#fff;}

  .locCard{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s;}
  .locCard:hover{border-color:var(--accent2);}
  .locCard.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .locCard.selForDel{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger);}
  .locCard .row1{display:flex;align-items:center;gap:8px;}
  .locCard .badge{width:20px;height:20px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#06131a;}
  .locCard .title{font-size:13.5px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .locCard .cat{font-size:10.5px;color:var(--muted);flex:0 0 auto;}
  .locCard .addr{font-size:11.5px;color:var(--muted);margin-top:4px;padding-left:28px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .locCard .mediaCount{font-size:11px;color:var(--accent2);margin-top:4px;padding-left:28px;}

  .photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 20px;overflow-y:auto;flex:1;}
  .photoCard{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;
    border:1px solid var(--border);aspect-ratio:4/3;background:#000;}
  .photoCard.selForDel{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger);}
  .photoCard img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.85);}
  .photoCard:hover img{filter:brightness(1);}
  .photoCard .pcLabel{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;
    background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11.5px;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .photoCard .pcCount{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);
    border-radius:999px;padding:2px 7px;font-size:10.5px;}
  .photoCard .pcCat{position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:50%;}
  .photoCard .selCheck{position:absolute;top:5px;left:5px;}

  #btnMapMode{position:absolute;top:14px;left:calc(50% + 4px);z-index:600;padding:8px 12px;border-radius:9px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:12px;
    font-weight:700;cursor:pointer;box-shadow:var(--shadow);}
  #btnMapMode:hover{border-color:var(--accent2);}
  #toggleSidebarBtn{position:absolute;top:14px;left:14px;z-index:600;width:40px;height:40px;
    border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:17px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);}

  /* ---------- Detail Panel ---------- */
  #detailPanel{position:absolute;top:0;right:0;height:100%;width:380px;background:var(--panel);
    border-left:1px solid var(--border);z-index:550;transform:translateX(100%);
    transition:transform .25s ease;display:flex;flex-direction:column;}
  #detailPanel.open{transform:translateX(0);}
  .dp-head{padding:16px;border-bottom:1px solid var(--border);}
  .dp-head .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .dp-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px;}
  .dp-close:hover{color:var(--text);}
  #dpTitleInput{width:100%;background:transparent;border:none;color:var(--text);font-size:16px;
    font-weight:700;padding:3px 0;outline:none;}
  #dpTitleInput:not([readonly]){border-bottom:1px dashed var(--border);}
  #dpTitleInput:not([readonly]):focus{border-color:var(--accent2);}
  .catRow{display:flex;align-items:center;gap:6px;margin-top:8px;}
  #dpCategorySelect{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;font-size:11.5px;padding:4px 6px;flex:1;}
  #dpColorInput{width:34px;height:28px;padding:2px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel2);cursor:pointer;flex:0 0 auto;}
  #dpStreetViewBtn{background:var(--panel2);border:1px solid var(--border);color:var(--accent2);
    border-radius:6px;font-size:11.5px;font-weight:700;padding:4px 8px;cursor:pointer;flex:0 0 auto;white-space:nowrap;}
  #dpGmapsKeyBtn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    border-radius:6px;font-size:13px;padding:4px 7px;cursor:pointer;flex:0 0 auto;}
  .distList{display:flex;flex-direction:column;gap:4px;}
  .distRow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--border);cursor:pointer;font-size:12.5px;}
  .distRow:hover{border-color:var(--accent2);}
  .distRow .dName{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .distRow .dVal{color:var(--accent2);font-weight:700;font-size:11.5px;flex:0 0 auto;}
  #dpCoordHint{font-size:10.5px;color:var(--muted);margin-top:6px;}
  .dp-body{flex:1;overflow-y:auto;padding:16px;}
  .dp-section{margin-bottom:18px;}
  .dp-section h3{margin:0 0 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .dp-section textarea, .dp-section input[type=text]{
    width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:13.5px;line-height:1.55;padding:8px 10px;resize:vertical;outline:none;}
  .dp-section textarea:focus, .dp-section input[type=text]:focus{border-color:var(--accent2);}
  .dp-section textarea[readonly], .dp-section input[readonly]{background:transparent;border-color:transparent;padding:0;}
  .dp-section.sunseeker{background:rgba(245,182,63,.08);border:1px solid rgba(245,182,63,.3);
    border-radius:10px;padding:10px 12px;}
  .dp-section.sunseeker h3{color:var(--accent);}
  .dp-section.sunseeker textarea{background:transparent;border-color:rgba(245,182,63,.25);}
  .mediaHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .mediaHead button{background:var(--panel2);border:1px solid var(--border);color:var(--accent2);
    font-size:11.5px;font-weight:700;border-radius:7px;padding:5px 9px;cursor:pointer;}
  .mediaGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .boxSel{position:absolute;border:1.5px dashed var(--accent2);background:rgba(79,179,255,.14);
    pointer-events:none;z-index:450;border-radius:3px;}
  .catEditBtn{background:var(--panel2);border:1px solid var(--border);color:var(--accent2);
    border-radius:7px;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;}
  .catEditBtn:hover{border-color:var(--accent2);}
  /* 🔴 이름이 «catEditRow» 인 이유 — 상세 패널에 이미 .catRow 가 있다. 같은 이름을 쓰면
     스타일이 섞이고 querySelectorAll 이 남의 줄까지 집는다 (2026-10-09 검사에서 실제로 걸림) */
  .catEditRow{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .catEditRow input[type=text].cIcon{width:46px;text-align:center;flex:0 0 auto;}
  .catEditRow input[type=text]{flex:1;background:var(--panel2);border:1px solid var(--border);
    border-radius:7px;color:var(--text);font-size:12.5px;padding:6px 8px;outline:none;}
  .catEditRow input[type=text]:focus{border-color:var(--accent2);}
  .catEditRow input[type=color]{width:34px;height:30px;padding:2px;border-radius:6px;
    border:1px solid var(--border);background:var(--panel2);cursor:pointer;flex:0 0 auto;}
  .catEditRow .cDel{background:rgba(248,113,113,.1);border:1px solid #5c2a2a;color:var(--danger);
    border-radius:6px;font-size:12px;padding:5px 8px;cursor:pointer;flex:0 0 auto;}
  .catEditRow .cUsed{font-size:10px;color:var(--muted);flex:0 0 auto;min-width:34px;text-align:right;}
  .mediaCell{display:flex;flex-direction:column;gap:4px;}
  .mCaption{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:6px;
    color:var(--text);font-size:11px;padding:4px 6px;outline:none;}
  .mCaption:focus{border-color:var(--accent2);}
  .mCaption[readonly]{background:transparent;border-color:transparent;padding:0 2px;color:var(--muted);}
  .mediaThumb{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;
    border:1px solid var(--border);background:#000;}
  .mediaThumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .mediaThumb.dragging{opacity:.35;}
  .mediaThumb[draggable=true]{cursor:grab;}
  /* 사진을 끌고 있을 때 «어디에 놓을 수 있는지» 보이게 */
  body.media-dragging .locCard{outline:1px dashed var(--accent2);}
  .locCard.dropTarget{border-color:var(--accent2)!important;box-shadow:0 0 0 2px var(--accent2);}
  body.media-dragging .loc-marker{outline:2px dashed var(--accent2);outline-offset:2px;}
  .loc-marker.dropTarget{outline:3px solid var(--accent2);outline-offset:2px;}
  .mediaThumb .mTypeBadge{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.65);
    border-radius:6px;padding:1px 6px;font-size:10px;}
  .mediaThumb .mRemove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,.7);border:none;color:#fff;font-size:12px;cursor:pointer;line-height:1;}
  .mediaThumb .mPlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:rgba(0,0,0,.2);pointer-events:none;}
  #dpDeleteBtn{width:100%;margin-top:4px;padding:9px;border-radius:9px;border:1px solid #5c2a2a;
    background:rgba(248,113,113,.12);color:var(--danger);font-size:12.5px;font-weight:700;cursor:pointer;}

  /* ---------- Toast ---------- */
  #saveToast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-10px);
    background:#111;border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:999px;
    font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:3000;box-shadow:var(--shadow);}
  #saveToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #saveToast.ok{color:#7ee787;border-color:#1f4a2e;}
  #saveToast.err{color:var(--danger);border-color:#5c2a2a;}

  /* ---------- Lightbox ---------- */
  #lightbox{position:fixed;inset:0;background:rgba(5,6,9,.94);z-index:3000;   /* 🔴 「사진 옮기기」 창(2500)보다 앞 — 거기서 사진을 눌러도 뒤에 깔리지 않게(2026-10-09 대표 신고) */
   
    display:none;align-items:center;justify-content:center;flex-direction:column;}
  #lightbox.open{display:flex;}
  .lb-top{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;
    justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;z-index:10;}
  .lb-top .lb-title{color:var(--text);font-weight:700;font-size:14px;}
  .lb-close{background:none;border:none;color:var(--text);font-size:26px;cursor:pointer;line-height:1;}
  .lbPairBtn{background:rgba(245,182,63,.18);border:1px solid rgba(245,182,63,.55);color:var(--accent);
    border-radius:999px;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;}
  .lbPairBtn:hover{background:rgba(245,182,63,.32);}
  .mPair{width:100%;background:var(--panel2);border:1px solid rgba(245,182,63,.35);border-radius:6px;
    color:var(--accent);font-size:10.5px;padding:3px 4px;}
  .mPairTag{font-size:10.5px;color:var(--accent);}
  .lb-stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;padding:60px 70px;}
  .lb-stage img,.lb-stage video{max-width:100%;max-height:78vh;border-radius:8px;box-shadow:var(--shadow);}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--text);
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lb-nav:hover{background:rgba(255,255,255,.18);}
  .lb-prev{left:14px;} .lb-next{right:14px;}
  .lb-bottom{padding:10px 18px 22px;text-align:center;}
  /* ✏️ 사진 위 표시 (2026-10-09 대표 지시) — 표시는 사진 파일을 안 고치고 «위에 얹는» 선으로 저장한다 */
  .lbImgWrap{position:relative;display:inline-block;line-height:0;}
  .lbImgWrap svg.annoLayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .lbImgWrap.annotating svg.annoLayer{pointer-events:auto;cursor:crosshair;}
  .lbImgWrap.annotating svg.annoLayer text{cursor:move;}
  .annoTa{position:absolute;z-index:3;line-height:1.2;font-weight:800;min-width:4em;min-height:1.3em;
    field-sizing:content;resize:none;overflow:hidden;background:rgba(0,0,0,.25);border:1.5px dashed rgba(255,255,255,.8);
    border-radius:4px;padding:0 2px;margin:0;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
    text-shadow:0 0 2px #000,0 0 2px #000;outline:none;white-space:pre;}
  .lbAnnoBtn{background:rgba(79,179,255,.15);border:1px solid rgba(79,179,255,.5);color:var(--accent2);
    border-radius:999px;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;}
  #lbAnnoBar{display:none;position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:12;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px 8px;gap:6px;
    align-items:center;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center;max-width:94vw;}
  #lbAnnoBar.open{display:flex;}
  #lbAnnoBar button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;}
  #lbAnnoBar button.on{border-color:var(--accent2);color:var(--accent2);}
  #lbAnnoBar button.done{background:var(--accent2);color:#06131a;border-color:var(--accent2);}
  #lbAnnoBar select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 6px;font-size:12px;font-weight:700;}
  #lbAnnoBar input[type=color]{width:34px;height:30px;border:none;background:none;padding:0;cursor:pointer;}
  .mAnnoTag{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.65);border-radius:6px;font-size:10px;padding:1px 5px;}
  /* 📍 핀 옆 스팟 이름 · 🅣 지도 글자 */
  .loc-marker{position:relative;}
  .pinLabel{position:absolute;left:30px;top:50%;transform:translateY(-50%);white-space:nowrap;
    background:rgba(15,17,21,.82);color:#fff;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;
    border-left:3px solid currentColor;pointer-events:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;}
  .mapText{white-space:pre;text-align:center;font-weight:800;line-height:1.15;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 2px #000;
    transform:translate(-50%,-50%);display:inline-block;cursor:pointer;user-select:none;}
  #btnMapText{position:absolute;top:14px;right:calc(50% + 4px);z-index:600;padding:8px 12px;border-radius:9px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:12px;
    font-weight:700;cursor:pointer;box-shadow:var(--shadow);}
  #btnMapText.on{border-color:var(--accent2);color:var(--accent2);}
  /* 지도 위 버튼 묶음 — 가운데 위 */
  #mapTopBtns{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:600;display:flex;gap:8px;}
  #mapTopBtns > button{position:static;transform:none;}
  #btnPoi{padding:8px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:12px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;}
  #btnPoi.on{border-color:var(--accent2);color:var(--accent2);}
  #map.texting{cursor:text;}
  /* 💬 V2 사진·댓글 */
  .v2Feed{border:1px solid rgba(79,179,255,.35);border-radius:12px;padding:12px;background:rgba(79,179,255,.05);}
  .v2Photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
  .v2Photo{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#000;cursor:pointer;}
  .v2Photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .v2Photo .who{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:10px;padding:8px 5px 3px;color:#fff;}
  .v2Del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:12px;}
  /* 왼쪽 목록(340px) «옆» 지도 위 — 목록의 핀 카드를 가리면 거기에 놓을 수가 없다(시험에서 잡음) */
  #upBlock{display:none;position:fixed;inset:0;z-index:5000;background:rgba(5,6,9,.72);align-items:center;justify-content:center;cursor:wait;}
  #upBlock.open{display:flex;}
  #upBlock .upBox{background:var(--panel);border:1px solid var(--accent2);border-radius:16px;padding:26px 28px;width:min(360px,calc(100vw - 32px));text-align:center;box-shadow:var(--shadow);}
  #upBlock .upSpin{width:38px;height:38px;margin:0 auto 12px;border:4px solid rgba(79,179,255,.25);border-top-color:var(--accent2);border-radius:50%;animation:upspin .9s linear infinite;}
  #upBlock.done .upSpin{display:none;}
  @keyframes upspin{to{transform:rotate(360deg);}}
  #upBlock .upTitle{font-size:16px;font-weight:800;margin-bottom:6px;}
  #upBlock .upFile{font-size:12px;color:var(--muted);margin-bottom:12px;word-break:break-all;min-height:1.2em;}
  #upBlock .upBar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;}
  #upBlock .upBar div{height:100%;width:0;background:var(--accent2);transition:width .3s;}
  #upBlock .upNote{font-size:11px;color:var(--muted);margin-top:10px;}
  #libPanel{display:none;position:fixed;left:352px;top:12px;bottom:12px;width:min(1100px,calc(100vw - 364px));z-index:1500;
    background:var(--panel);border:1px solid var(--accent2);border-radius:14px;box-shadow:var(--shadow);flex-direction:column;}
  #libPanel.open{display:flex;}
  #libPanel .libHead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px;font-size:13px;}
  #libPanel .libHead button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  #libUpload{width:100%;background:var(--accent2);color:#06131a;border:none;border-radius:9px;padding:9px;font-weight:800;cursor:pointer;font-size:13px;}
  #libPanel .libHint{font-size:11px;color:var(--muted);padding:0 12px 8px;}
  #libPanel .libGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:0 12px 12px;overflow-y:auto;align-content:start;flex:1;}
  #libPanel .libBar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 12px 8px;font-size:12px;}
  #libPanel .libBar button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;}
  #libPanel .libBar #libDelSel{color:var(--danger);} #libPanel .libBar #libDelSel:disabled{opacity:.4;cursor:default;}
  #libPanel .libBar .libCount{color:var(--accent2);font-weight:800;margin-right:auto;}
  .libChip.sel{outline:3px solid var(--accent2);outline-offset:-3px;}
  .libChip .lcChk{position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:6px;background:rgba(0,0,0,.6);border:2px solid #fff;color:#06131a;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .libChip.sel .lcChk{background:var(--accent2);border-color:var(--accent2);}
  .libChip{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#000;cursor:grab;border:1px solid var(--border);}
  .libChip img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .libChip .lcBtn{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.7);color:#fff;font-size:11px;cursor:pointer;}
  .libChip .lcView{right:30px;} .libChip .lcDel{right:3px;}
  .libChip .lcType{position:absolute;left:3px;bottom:3px;font-size:11px;background:rgba(0,0,0,.6);border-radius:4px;padding:0 3px;}
  .libSec{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--muted);margin-top:6px;padding-bottom:4px;border-bottom:1px solid var(--border);}
  .libEmpty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px;padding:14px 4px;}
  #v2AdminUpload{background:var(--accent2);color:#06131a;border:none;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:12px;}
  #v2AddPhoto,#v2Send{background:var(--accent2);color:#06131a;border:none;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;font-size:13px;}
  #v2AddPhoto{width:100%;}
  .v2Status{font-size:12px;margin:6px 0;color:var(--muted);min-height:1em;}
  .v2Status.err{color:var(--danger);} .v2Status.ok{color:#7ee787;}
  .v2Comments{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
  .v2C{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;position:relative;}
  .v2C .h{font-size:11px;color:var(--muted);margin-bottom:3px;} .v2C .h b{color:var(--text);}
  .v2C .b{font-size:13px;white-space:pre-wrap;word-break:break-word;}
  .v2C .v2Del{top:6px;right:6px;}
  .v2Write{display:flex;flex-direction:column;gap:6px;}
  .v2Write input,.v2Write textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;}
  .v2Empty{font-size:12px;color:var(--muted);text-align:center;padding:6px;}
  .v2Badge{font-size:11px;color:var(--accent2);font-weight:700;margin-left:6px;}
  #mapTextModal input[type=text],#mapTextModal textarea,#mapTextModal select{background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:9px 10px;font-size:14px;}
  #mapTextModal button#mtDone,#mapTextModal button#mtDelete{padding:10px;border-radius:9px;font-weight:700;cursor:pointer;
    border:1px solid var(--border);background:var(--panel2);color:var(--text);}
  #mapTextModal button#mtDone{background:var(--accent2);color:#06131a;border-color:var(--accent2);}
  #mapTextModal button#mtDelete{color:var(--danger);}
  .lb-caption{font-size:13.5px;color:var(--text);margin-bottom:8px;}
  .lb-sunBadge{display:inline-flex;align-items:center;gap:6px;background:rgba(245,182,63,.15);
    color:var(--accent);border:1px solid rgba(245,182,63,.4);border-radius:999px;padding:3px 10px;font-size:11.5px;margin-bottom:8px;}
  .lb-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:80vw;}
  .lb-dots span{width:6px;height:6px;border-radius:50%;background:#444b58;cursor:pointer;}
  .lb-dots span.on{background:var(--accent);}

  /* ---------- Modals (media picker / export) ---------- */
  .modalOverlay{position:fixed;inset:0;background:rgba(5,6,9,.8);z-index:2500;display:none;
    align-items:center;justify-content:center;padding:20px;}
  .modalOverlay.open{display:flex;}
  .modalBox{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:640px;max-height:84vh;display:flex;flex-direction:column;box-shadow:var(--shadow);}
  .modalHead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center;}
  .modalHead h2{margin:0;font-size:15px;}
  .modalHead button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
  .modalBody{padding:16px 18px;overflow-y:auto;flex:1;}
  .modalFoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
  .modalFoot button{padding:9px 16px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;}
  .modalFoot button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);}

  .pickerGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .pickerCard{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;
    border:2px solid var(--border);background:#000;}
  .pickerCard img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75;}
  .pickerCard:hover img{opacity:1;}
  .pickerCard.selected{border-color:var(--accent);}
  .pickerCard.selected img{opacity:1;}
  .pickerCard .pTick{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;
    justify-content:center;font-size:11px;}
  .pickerCard.selected .pTick{background:var(--accent);color:#1a1405;border-color:var(--accent);}
  .pickerCard .pType{position:absolute;bottom:4px;left:4px;font-size:10px;background:rgba(0,0,0,.6);
    border-radius:5px;padding:0 4px;}
  .pickerCard .pUsed{position:absolute;bottom:4px;right:4px;font-size:9px;background:rgba(0,0,0,.7);
    color:var(--accent2);border-radius:5px;padding:0 4px;}

  .gmapsBox{max-width:420px;}
  .gmapsNote{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0 0 10px;}
  .gmapsInput{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:9px 10px;font-size:13px;outline:none;}
  .gmapsInput:focus{border-color:var(--accent2);}

  .svBox{max-width:960px;width:100%;}
  .svHeadRight{display:flex;align-items:center;gap:10px;}
  .svOpenLink{font-size:11.5px;color:var(--accent2);text-decoration:none;white-space:nowrap;}
  .svOpenLink:hover{text-decoration:underline;}
  .svControls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 18px 12px;
    border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  .svControls input[type=datetime-local]{background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:7px;padding:5px 7px;font-size:12px;}
  .svPathToggle{display:flex;align-items:center;gap:5px;cursor:pointer;}
  #svMovePinBtn{background:var(--panel2);border:1px solid var(--border);color:var(--accent);
    border-radius:7px;font-size:11.5px;font-weight:700;padding:5px 10px;cursor:pointer;white-space:nowrap;}
  #svMovePinBtn:hover{border-color:var(--accent);}
  #svSunReadout{color:var(--accent);font-weight:700;margin-left:auto;}
  #svPanoWrap{position:relative;width:100%;height:60vh;background:#000;}
  #svPano{position:absolute;inset:0;}
  #svOverlay{position:absolute;inset:0;pointer-events:none;z-index:400;}
  #svNoKeyMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;padding:30px;text-align:center;}

  #exportTextarea{width:100%;height:220px;background:#0b0d11;border:1px solid var(--border);
    border-radius:8px;color:#8ee37c;font-family:"SF Mono",Menlo,monospace;font-size:11px;
    padding:10px;resize:vertical;}
  .exportNote{font-size:11.5px;color:var(--muted);margin:8px 0 14px;line-height:1.6;}
  .exportDangerRow{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .exportDangerRow label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);
    color:var(--accent2);font-size:12px;font-weight:700;cursor:pointer;}
  .exportDangerRow button{flex:1;}
  #importFileInput{display:none;}

  /* custom marker */
  .loc-marker{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#06131a;font-weight:800;font-size:11px;border:2px solid #0f1115;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .loc-marker.new{animation:pulse 1s ease-out 2;}
  .loc-marker.selForDel{outline:3px solid var(--danger);outline-offset:1px;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,182,63,.6);}100%{box-shadow:0 0 0 14px rgba(245,182,63,0);}}

  .upProgressBar{width:100%;height:10px;border-radius:999px;background:var(--panel2);
    border:1px solid var(--border);overflow:hidden;}
  .upProgressFill{height:100%;width:0%;background:var(--accent2);transition:width .15s;}

  .reviewBox{max-width:1000px;width:100%;}
  .reviewCols{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
  .reviewCol{flex:0 0 270px;background:var(--panel2);border:1px solid var(--border);
    border-radius:var(--radius);padding:10px;min-height:160px;transition:.15s;}
  .reviewCol.dragover{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(79,179,255,.3);}
  .reviewCol.unsorted{border-style:dashed;}
  .reviewColHead{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
    margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .reviewColHead .rcDot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .reviewColHead .rcName{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reviewColHead .rcCount{font-size:10.5px;color:var(--muted);font-weight:600;}
  .reviewGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:40px;}
  .reviewChip .rcFile{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:1px 4px;border-radius:4px;font-family:ui-monospace,monospace;}
  .reviewZone{border:1px dashed var(--border);border-radius:8px;padding:6px;margin-bottom:8px;transition:.15s;}
  .reviewZone.sun{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.05);}
  .reviewZone.dragover{border-style:solid;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(79,179,255,.3);}
  .reviewZone .rzHead{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .reviewZone .reviewGrid{min-height:0;}
  .reviewZone .rzEmpty{font-size:11px;color:var(--muted);text-align:center;padding:10px 4px;}
  .sunDropEmpty{font-size:12px;color:var(--muted);text-align:center;padding:14px 6px;
    border:1px dashed rgba(251,191,36,.45);border-radius:8px;}
  .dp-section.dropTarget{outline:2px solid var(--accent2);outline-offset:3px;border-radius:8px;}
  /* ↔ 사진 순서 바꾸기 — 놓을 자리 표시 */
  .mediaCell.reorderBefore{box-shadow:-4px 0 0 0 var(--accent2);}
  .mediaCell.reorderAfter{box-shadow:4px 0 0 0 var(--accent2);}
  .reviewChip{position:relative;border-radius:7px;overflow:hidden;aspect-ratio:4/3;cursor:grab;
    border:1px solid var(--border);background:#000;}
  .reviewChip img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .reviewChip.dragging{opacity:.35;}
  .reviewChip .rcType{position:absolute;top:3px;left:3px;font-size:10px;background:rgba(0,0,0,.65);
    border-radius:4px;padding:0 5px;pointer-events:none;}
  .reviewChip .rcZoom{position:absolute;bottom:3px;right:3px;font-size:11px;background:rgba(0,0,0,.7);
    border-radius:5px;padding:1px 5px;cursor:zoom-in;}
  .reviewChip .rcZoom:hover{background:var(--accent2);color:#07131c;}

  @media (max-width:760px){
    #sidebar{width:88%;max-width:360px;transform:translateX(-100%);}
    #sidebar.open{transform:translateX(0);}
    #detailPanel{width:92%;max-width:420px;}
    #toggleSidebarBtn{display:flex;}
    .lb-stage{padding:50px 20px;}
    .lb-nav{width:40px;height:40px;font-size:17px;}
    .pickerGrid{grid-template-columns:repeat(3,1fr);}
    .reviewCol{flex:0 0 160px;}
    #libPanel{left:12px;width:calc(100vw - 24px);height:60vh;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map" class="editing"></div>
  <div id="saveToast"></div>

  <button id="toggleSidebarBtn">☰</button>
  <div id="mapTopBtns">
    <button id="btnMapText"></button>
    <button id="btnMapMode"></button>
    <button id="btnPoi"></button>
  </div>
  <!-- 🅣 지도 글자 편집 -->
  <div class="modalOverlay" id="mapTextModal">
    <div class="modalBox" style="max-width:380px;">
      <div class="modalHead"><h2 id="mtTitle"></h2><button id="mtClose">✕</button></div>
      <div class="modalBody" style="display:flex;flex-direction:column;gap:10px;">
        <textarea id="mtText" rows="3" style="width:100%;resize:vertical;"></textarea>
        <p class="gmapsNote" id="mtHint" style="margin:0;"></p>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <label style="display:flex;gap:6px;align-items:center;font-size:12px;"><span id="mtColorLbl"></span> <input type="color" id="mtColor" value="#ffffff"></label>
          <label style="display:flex;gap:6px;align-items:center;font-size:12px;"><span id="mtSizeLbl"></span>
            <select id="mtSize"><option value="13">S</option><option value="17" selected>M</option><option value="24">L</option><option value="34">XL</option></select></label>
        </div>
        <div style="display:flex;gap:8px;">
          <button id="mtDelete" style="flex:1;"></button>
          <button id="mtDone" style="flex:2;"></button>
        </div>
      </div>
    </div>
  </div>

  <aside id="sidebar">
    <div class="sb-head">
      <h1><span id="appTitleText"></span> <span class="cnt" id="locCountBadge">0</span></h1>
      <p id="appSubtitleText"></p>
      <div class="sbActions">
        <button id="btnEditToggle" class="on"></button>
        <button id="btnSelectMode"></button>
        <button id="btnExport"></button>
        <button id="btnLang"></button>
        <button id="btnBulkUpload" style="flex:1 1 100%;"></button>
        <button id="btnUnsorted" style="flex:1 1 100%;display:none;"></button>
      </div>
      <p class="gmapsNote" id="uploadFolderHint" style="margin:6px 0 0;"></p>
      <p class="gmapsNote" id="backupStatus" style="margin:6px 0 0;"></p>
      <input type="file" id="bulkUploadInput" multiple accept="image/*,video/*" style="display:none;">
    </div>
    <div id="editBanner"></div>
    <div id="bulkBar">
      <span id="bulkBannerText"></span>
      <div class="bulkActions">
        <span id="bulkCount"></span>
        <button id="bulkSelectAllBtn"></button>
        <button id="bulkDeleteBtn" disabled></button>
        <button id="bulkCancelBtn"></button>
      </div>
    </div>
    <div class="viewToggle">
      <button id="btnViewList" class="active"></button>
      <button id="btnViewPhoto"></button>
    </div>
    <div class="filters" id="filters"></div>
    <div style="padding:2px 16px 0;"><button id="btnEditCats" class="catEditBtn"></button></div>
    <div id="listWrap"></div>
    <div class="photoGrid" id="photoGrid" style="display:none;"></div>
  </aside>

  <div id="detailPanel">
    <div class="dp-head">
      <div class="row">
        <div style="flex:1;">
          <input id="dpTitleInput" type="text" value="">
          <div class="catRow">
            <select id="dpCategorySelect"></select>
            <input type="color" id="dpColorInput" value="#34d399">
            <button id="dpStreetViewBtn" type="button"></button>
            <button id="dpGmapsKeyBtn" type="button">⚙️</button>
          </div>
          <div id="dpCoordHint">—</div>
        </div>
        <button class="dp-close" id="dpClose">✕</button>
      </div>
    </div>
    <div class="dp-body">
      <div class="dp-section">
        <h3><span id="lblAddress"></span> <span id="dpAddrStatus" style="font-weight:400;text-transform:none;"></span></h3>
        <input id="dpAddressInput" type="text">
      </div>
      <div class="dp-section">
        <h3 id="lblNotes"></h3>
        <textarea id="dpNotesInput" rows="4"></textarea>
      </div>
      <!-- ☀️ 2026-10-09 대표 지시 — 「Sunseeker 노트」 칸은 뺐다(대표: 없어도 된다). 그 자리에 «Sunseeker 사진» 칸을 올렸다.
           노트 칸이 사진 칸과 똑같이 생겨서, 사진을 옮겨도 「안 보인다」로 보였다(실제로는 아래쪽 사진 칸에 들어가 있었다).
           노트 입력칸은 숨겨만 둔다 — 이미 적힌 메모 데이터는 지우지 않는다. -->
      <div class="dp-section sunseeker" style="display:none;">
        <h3 id="lblSunseeker"></h3>
        <textarea id="dpSunseekerInput" rows="3"></textarea>
      </div>
      <div class="dp-section sunseeker" id="dpSunGroupWrap" style="display:none;">
        <h3 id="lblSunMedia"></h3>

function loadCategories(){
  /* 발행본은 파일에 박힌 분류를 그대로 쓴다 (보는 사람 브라우저 저장소와 무관) */
  if(typeof SCOUT_PUBLISHED !== 'undefined' && SCOUT_PUBLISHED && Array.isArray(SCOUT_PUBLISHED.categories) && SCOUT_PUBLISHED.categories.length){
    return SCOUT_PUBLISHED.categories.map(c=>({...c}));
  }
  try{
    const raw = localStorage.getItem(CATEGORIES_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length) return arr;
    }
  }catch(e){}
  return CATEGORIES_DEFAULT.map(c=>({...c}));
}

}

  const c = CATEGORIES.find(x=>x.key===key);

/* =========================================================
   1. 상태 — localStorage에 자동 저장
   ========================================================= */
/* 🔴 발행본(인터넷 공유용)은 «같은 파일»이다 — 뷰어를 따로 만들면 두 개가 되어 어긋난다(§1).
   발행 스크립트가 이 파일 위에 SCOUT_PUBLISHED(장소 데이터 + 분류)를 끼워 넣는다.
   그 값이 있으면 = 발행본 → 편집 기능을 전부 숨기고 브라우저 저장도 안 쓴다. */
const PUBLISHED = (typeof SCOUT_PUBLISHED !== 'undefined') ? SCOUT_PUBLISHED : null;
/* 🔑 2026-10-09 대표 지시 「관리자 모드 버튼 → 비밀번호 쳐서 편집」 — 공개 링크에서 편집 비밀번호를 넣고 들어온 상태.
   화면은 편집본과 같고, 저장은 브라우저가 아니라 «서버»로 간다(보는 사람에게 바로 반영). */
const V2EDIT = !!(PUBLISHED && PUBLISHED.v2 && PUBLISHED.v2.pw);

const STORAGE_KEY = KP + 'locations';
let LOCATIONS = [];
if(PUBLISHED){
  LOCATIONS = PUBLISHED.locations || [];
} else {
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) LOCATIONS = JSON.parse(saved);
    /* 🔴 비어 있는데 직전 세대가 남아 있으면 그걸 되살린다 (업데이트 사고 대비) */
    if((!LOCATIONS || !LOCATIONS.length)){
      const prev = localStorage.getItem(STORAGE_KEY + '_prev');
      if(prev){
        const p = JSON.parse(prev);
        if(Array.isArray(p) && p.length){ LOCATIONS = p; console.log('[복구] 직전 저장본에서 ' + p.length + '곳을 되살렸습니다'); }
      }
    }
  }catch(e){ LOCATIONS = []; }
}
let nextId = LOCATIONS.reduce((m,l)=>Math.max(m,l.id||0),0) + 1;

let editMode = !PUBLISHED || V2EDIT;
let selectMode = false;
let currentLocId = null;
const markers = {};
const activeCats = new Set(CATEGORIES.map(c=>c.key));
const selectedIds = new Set();

let saveToastTimer;
function flashSaved(msg){
  const el = document.getElementById('saveToast');
  el.textContent = msg || t('saved'); el.className = 'toast show ok';
  clearTimeout(saveToastTimer); saveToastTimer = setTimeout(()=> el.classList.remove('show'), msg ? 2600 : 1100);
}
function flashError(msg){
  const el = document.getElementById('saveToast');
  el.textContent = '⚠ ' + msg; el.className = 'toast show err';
  clearTimeout(saveToastTimer); saveToastTimer = setTimeout(()=> el.classList.remove('show'), 3000);
}
function saveState(){
  if(PUBLISHED){ if(V2EDIT) v2SaveSoon(); return; }   /* 발행본은 보는 것만 — 관리자 편집 중이면 서버로 */
  try{
    /* 🔴 「업데이트돼도 작업한 게 그대로 남게」 (2026-10-09 대표 지시)
       ㉮ 저장소 열쇠(STORAGE_KEY)는 절대 안 바꾼다 — 바꾸면 그 순간 옛 작업이 안 보인다
       ㉯ 덮어쓰기 «전»의 값을 한 세대 남긴다 — 코드 실수로 비워져도 되살릴 수 있다 */
    const before = localStorage.getItem(STORAGE_KEY);
    if(before && before !== '[]') localStorage.setItem(STORAGE_KEY + '_prev', before);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(LOCATIONS));
    flashSaved();
  }
  catch(e){ flashError(t('saveFail')); }
  scheduleBackup();       /* 🔴 드라이브 폴더에도 파일로 한 벌 더 — 크롬 데이터가 날아가도 살아남게 */
}
function debounce(fn, delay){
  let tt; return function(...args){ clearTimeout(tt); tt = setTimeout(()=>fn.apply(this,args), delay); };
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

   ========================================================= */
const gpsPts = MEDIA_FILES.filter(f=>f.lat!=null);
const centerLat = gpsPts.length ? gpsPts.reduce((s,p)=>s+p.lat,0)/gpsPts.length : 37.5665;
const centerLng = gpsPts.length ? gpsPts.reduce((s,p)=>s+p.lng,0)/gpsPts.length : 126.9780;

const map = L.map('map', { zoomControl:false }).setView([centerLat, centerLng], 18);
L.control.zoom({ position:'bottomright' }).addTo(map);

/* 지도 라벨 언어 — ko:OSM 기본(현지 표기) · en:위키미디어 다국어 타일(lang=en, 로마자 표기) */
let tileLayer = null;
/* 🔴 2026-10-09 대표 지시 — 「길 사이사이까지 봤으면 한다」.
   일반 지도는 공원 안 산책로가 빈약하다 → «위성사진»을 같이 쓴다(키 불필요).
   지도 모드는 브라우저에 기억시킨다. */
let MAP_MODE = localStorage.getItem('scout2_mapmode') || 'map';   /* map | satellite */
function buildTileLayer(){
  if(MAP_MODE === 'satellite'){
    return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics', maxZoom: 19, maxNativeZoom: 19
    });
  }
  return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', subdomains: 'abc', maxZoom: 19
  });
}
/* 🔴 2026-10-09 대표 신고 「영문으로 바꾸면 지도가 안 보여」 — 영문 타일(위키미디어)이 외부 사이트를 막아(403) 빈 화면이었다.
   한국은 지도 데이터 반출 제한 때문에 Esri·CARTO 등 무료 영문 지도도 비어 있다(실측).
   → 영문일 때는 «구글 공식 지도»(스트리트뷰와 같은 키)를 영어로 띄운다. 키가 없거나 실패하면 일반 지도로 둔다. */
let mapLayerSeq = 0;
/* 🏷 2026-10-09 대표 지시 「지정한 스팟 외 장소들 이름때문에 너무 헷갈려」 — 구글 지도의 가게·건물·정류장 이름과 아이콘을 기본으로 숨긴다.
   길·공원 모양·큰길 이름은 남긴다. 「🏷 주변 이름」 버튼으로 다시 켤 수 있다(브라우저에 기억). */
const CLEAN_MAP_STYLES = [
  { featureType:'poi', elementType:'labels', stylers:[{ visibility:'off' }] },
  { featureType:'transit', stylers:[{ visibility:'off' }] },
  { featureType:'landscape', elementType:'labels', stylers:[{ visibility:'off' }] },
  { featureType:'road.local', elementType:'labels', stylers:[{ visibility:'off' }] }
];
let POI_ON = (function(){ try{ return localStorage.getItem('scout2_poi') === '1'; }catch(e){ return false; } })();
function applyMapLayer(){
  const seq = ++mapLayerSeq;
  if(tileLayer) map.removeLayer(tileLayer);
  tileLayer = buildTileLayer();
  tileLayer.addTo(map);
  /* 🔴 setTimeout 0 — 첫 화면에서는 키 읽는 부분(아래쪽 코드)이 아직 준비 전이라 바로 부르면 멈춘다 */
  /* 🗺 2026-10-09 대표 「보기전용(구글) 지도가 더 정확」 — 한글일 때도 구글 지도를 기본으로(한글 표기). 키 없으면 오픈스트리트맵 */
  if(MAP_MODE !== 'satellite') setTimeout(()=>{
    if(seq !== mapLayerSeq) return;
    const key = getGmapsKey();
    if(!key || !L.gridLayer || !L.gridLayer.googleMutant){ if(LANG === 'en') flashError(t('enMapNeedsKey')); }
    else if(window.google && window.google.maps && window.__gmapsLang && window.__gmapsLang !== LANG){
      location.reload();   /* 구글은 한 번 불러오면 언어를 못 바꾼다 — 작업은 저장돼 있으니 새로고침으로 바꾼다 */
      return;
    } else {
      loadGoogleMaps(key).then(()=>{
        if(seq !== mapLayerSeq) return;      /* 그 사이 다시 바뀌었으면 무시 */
        const g = L.gridLayer.googleMutant({ type:'roadmap', maxZoom: 21, styles: POI_ON ? [] : CLEAN_MAP_STYLES });
        map.removeLayer(tileLayer); tileLayer = g; g.addTo(map);
      }).catch(()=> flashError(t('enMapNeedsKey')));
    }
  }, 0);
  /* 🔴 위성사진은 원래 어둡다 — 일반 지도에만 걸던 «반전 다크» 필터를 빼야 색이 제대로 나온다 */
  document.getElementById('map').classList.toggle('satellite', MAP_MODE === 'satellite');
  const b = document.getElementById('btnMapMode');
  if(b) b.textContent = MAP_MODE === 'satellite' ? t('mapModeToMap') : t('mapModeToSat');
}
function setMapLanguage(lang){ applyMapLayer(); }
applyMapLayer();

function makeIcon(loc){
  const color = loc.color || catColor(loc.category);
  const sel = selectMode && selectedIds.has(loc.id) ? ' selForDel' : '';
  /* 📍 핀 옆에 스팟 이름을 띄운다 (2026-10-09 대표 지시) */
  /* 「스팟 번호도 같이」(대표 지시) — 번호 · 이름 */
  const lbl = `<span class="pinLabel" style="border-left-color:${color}">${loc.id}${loc.title ? ' · ' + escapeHtml(loc.title) : ''}</span>`;
  return L.divIcon({ className:'', html:`<div class="loc-marker${sel}" id="pin-${loc.id}" style="background:${color}">${loc.id}${lbl}</div>`,
    iconSize:[26,26], iconAnchor:[13,13] });
}
function addMarker(loc){
  const m = L.marker([loc.lat, loc.lng], { icon: makeIcon(loc), draggable:editMode }).addTo(map);
  m.on('click', ()=>{
    if(selectMode){ toggleSelect(loc.id); return; }
    openDetail(loc.id, false);
  });
  /* 🔴 지도에서 바로 지우기 — 오른쪽 클릭 (편집 모드일 때만) */
  m.on('contextmenu', (ev)=>{
    if(ev.originalEvent) ev.originalEvent.preventDefault();
    if(!editMode) return;
    const target = LOCATIONS.find(l=>l.id===loc.id);
    if(!target) return;
    if(!confirm(t('pinRightClickDelete')(target.title || t('noTitle')))) return;
    sendToUnsorted(target.media);
    const mk = markers[target.id]; if(mk) map.removeLayer(mk);
    delete markers[target.id];
    LOCATIONS = LOCATIONS.filter(l=>l.id!==target.id);
    if(currentLocId === target.id){
      currentLocId = null;
      document.getElementById('detailPanel').classList.remove('open');
    }
    selectedIds.delete(target.id);
    applyFilter(); refreshDistancesIfOpen(); updateBulkBar(); saveState();
  });
  m.on('dragend', (ev)=>{
    const ll = ev.target.getLatLng();
    const L2 = LOCATIONS.find(l=>l.id===loc.id);
    if(!L2) return;
    L2.lat = ll.lat; L2.lng = ll.lng;
    scheduleLabelLayout();
    if(currentLocId===loc.id) updateCoordHint(L2);
    refreshDistancesIfOpen();
    saveState();
  });
  markers[loc.id] = m;
  setTimeout(()=> bindMediaDrop(m.getElement(), loc.id), 0);
}
function rebuildAllMarkers(){
  Object.values(markers).forEach(m=> map.removeLayer(m));
  for(const k in markers) delete markers[k];
  LOCATIONS.forEach(addMarker);
  applyFilter();
}
function refreshDraggable(){
  /* 🔴 선택 모드에서는 핀 끌기를 끈다 — 끌기와 「드래그로 범위 선택」이 서로 먹는다 */
  const canDrag = editMode && !selectMode;
  Object.values(markers).forEach(m=> canDrag ? m.dragging.enable() : m.dragging.disable());
  if(selectMode) map.dragging.disable(); else map.dragging.enable();
}

/* ---- 드래그 박스로 여러 핀 한 번에 고르기 (선택 모드에서만) ---- */
let boxSelStart = null, boxSelEl = null;
map.on('mousedown', function(e){
  if(!selectMode) return;
  boxSelStart = e.containerPoint;
  boxSelEl = document.createElement('div');
  boxSelEl.className = 'boxSel';
  boxSelEl.style.left = boxSelStart.x + 'px';
  boxSelEl.style.top = boxSelStart.y + 'px';
  boxSelEl.style.width = '0px'; boxSelEl.style.height = '0px';
  map.getContainer().appendChild(boxSelEl);
});
/* 🔴 mousemove·mouseup 은 «문서»에 건다 — 지도에만 걸면 오른쪽 패널 위에서 손을 뗐을 때
   지도가 그 이벤트를 못 받아 선택이 영영 안 끝나고 사각형만 남는다 (2026-10-09 검사에서 잡음) */
document.addEventListener('mousemove', function(ev){
  if(!boxSelStart || !boxSelEl) return;
  const p = map.mouseEventToContainerPoint(ev);
  boxSelEl.style.left = Math.min(p.x, boxSelStart.x) + 'px';
  boxSelEl.style.top = Math.min(p.y, boxSelStart.y) + 'px';
  boxSelEl.style.width = Math.abs(p.x - boxSelStart.x) + 'px';
  boxSelEl.style.height = Math.abs(p.y - boxSelStart.y) + 'px';
});
document.addEventListener('mouseup', function(ev){
  if(!boxSelStart) return;
  const p = map.mouseEventToContainerPoint(ev);
  const dragged = Math.abs(p.x - boxSelStart.x) > 4 || Math.abs(p.y - boxSelStart.y) > 4;
  if(boxSelEl){ boxSelEl.remove(); boxSelEl = null; }
  const start = boxSelStart; boxSelStart = null;
  if(!dragged) return;                       /* 그냥 클릭한 것 — 선택을 안 건드린다 */
  const bounds = L.latLngBounds(map.containerPointToLatLng(start), map.containerPointToLatLng(p));
  LOCATIONS.forEach(loc=>{
    if(!activeCats.has(loc.category)) return;   /* 필터로 숨긴 것은 안 고른다 */
    if(bounds.contains(L.latLng(loc.lat, loc.lng))) selectedIds.add(loc.id);
  });
  refreshMarkerIcons(); renderList(); renderPhotoGrid(); updateBulkBar();
});
function refreshMarkerIcons(){
  LOCATIONS.forEach(loc=>{ const m = markers[loc.id]; if(m){ m.setIcon(makeIcon(loc)); bindMediaDrop(m.getElement(), loc.id); } });
}
function bindAllMarkerDrops(){
  LOCATIONS.forEach(loc=>{ const m = markers[loc.id]; if(m) bindMediaDrop(m.getElement(), loc.id); });
}
LOCATIONS.forEach(addMarker);

function createLocationAt(lat, lng, opts){
  opts = opts || {};
  /* 🔴 이름의 숫자는 «핀 번호(id)»와 같아야 한다 — 전에는 「지금 몇 개 있나」로 매겨서
     중간에 하나를 지우면 핀은 1,3,4 인데 이름은 1,2,3 으로 벌어졌다 (2026-10-09 대표 신고) */
  const id = nextId++;
  const loc = {
    id: id,
    title: opts.title || t('newLocTitle')(id),
    category: 'outdoor', color: catColor('outdoor'),
    lat, lng, address:'', notes:'', sunseeker:'', media: opts.media || []
  };
  LOCATIONS.push(loc);
  addMarker(loc);
  if(opts.geocode !== false) reverseGeocode(loc);
  return loc;
}
map.on('click', function(e){
  if(!editMode || selectMode) return;
  if(textMode){ addMapTextAt(e.latlng.lat, e.latlng.lng); return; }
  const loc = createLocationAt(e.latlng.lat, e.latlng.lng);
  applyFilter();
  saveState();
  openDetail(loc.id, false);
  const el = document.getElementById('pin-'+loc.id);
  if(el) el.classList.add('new');
});

/* =========================================================
   2-B. 🅣 지도 위 글자 (2026-10-09 대표 지시 「지도에도 텍스트 입력하고싶어. 색상 변경 가능하게」)
   「🅣 글자」 켜고 지도를 누르면 그 자리에 글자. 글자를 누르면 고치기·색·크기·지우기. 끌어서 옮김.
   🔴 핀과 따로 저장한다(핀 데이터를 안 건드린다) — 발행본에도 실린다.
   ========================================================= */
const MAP_TEXTS_KEY = KP + 'maptexts';
let MAP_TEXTS = (function(){
  if(typeof SCOUT_PUBLISHED !== 'undefined') return Array.isArray(SCOUT_PUBLISHED.mapTexts) ? SCOUT_PUBLISHED.mapTexts : [];
  try{ const v = JSON.parse(localStorage.getItem(MAP_TEXTS_KEY) || '[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; }
})();
let textMode = false, mapTextMarkers = {}, mtEditingId = null, mtLastColor = '#ffffff', mtLastSize = 17;
function saveMapTexts(){
  if(typeof SCOUT_PUBLISHED !== 'undefined'){ if(V2EDIT) v2SaveSoon(); return; }
  try{ localStorage.setItem(MAP_TEXTS_KEY, JSON.stringify(MAP_TEXTS)); flashSaved(); }catch(e){ flashError(t('saveFail')); }
  if(typeof scheduleBackup === 'function') scheduleBackup();
}
function mapTextIcon(o){
  return L.divIcon({ className:'', iconSize:null,
    html:`<span class="mapText" style="color:${o.color||'#fff'};font-size:${o.size||17}px">${escapeHtml(o.text)}</span>` });
}
function drawMapText(o){
  if(mapTextMarkers[o.id]) map.removeLayer(mapTextMarkers[o.id]);
  const mk = L.marker([o.lat, o.lng], { icon: mapTextIcon(o), draggable: !!editMode, zIndexOffset: -100 }).addTo(map);
  mk.on('click', (ev)=>{ L.DomEvent.stopPropagation(ev); if(editMode) openMapTextEditor(o.id); });
  mk.on('dragend', ev=>{ const ll = ev.target.getLatLng(); o.lat = ll.lat; o.lng = ll.lng; saveMapTexts(); });
  mapTextMarkers[o.id] = mk;
}
function redrawMapTexts(){
  Object.values(mapTextMarkers).forEach(m=> map.removeLayer(m)); mapTextMarkers = {};
  MAP_TEXTS.forEach(drawMapText);
}
function addMapTextAt(lat, lng){
  const id = 't' + Date.now();
  const o = { id, lat, lng, text: '', color: mtLastColor, size: mtLastSize };
  MAP_TEXTS.push(o);
  openMapTextEditor(id, true);
}
function openMapTextEditor(id, isNew){
  const o = MAP_TEXTS.find(x=>x.id===id); if(!o) return;
  mtEditingId = id;
  document.getElementById('mtTitle').textContent = isNew ? t('mtNew') : t('mtEdit');
  document.getElementById('mtText').value = o.text || '';
  document.getElementById('mtColor').value = o.color || '#ffffff';
  document.getElementById('mtSize').value = String(o.size || 17);
  document.getElementById('mapTextModal').classList.add('open');
  setTimeout(()=> document.getElementById('mtText').focus(), 30);
}
function closeMapTextEditor(){
  const o = MAP_TEXTS.find(x=>x.id===mtEditingId);
  if(o){
    o.text = document.getElementById('mtText').value.trim();
    o.color = document.getElementById('mtColor').value;
    o.size = Number(document.getElementById('mtSize').value) || 17;
    mtLastColor = o.color; mtLastSize = o.size;
    if(!o.text){ MAP_TEXTS = MAP_TEXTS.filter(x=>x.id!==o.id); if(mapTextMarkers[o.id]){ map.removeLayer(mapTextMarkers[o.id]); delete mapTextMarkers[o.id]; } }
    else drawMapText(o);
    saveMapTexts();
  }
  mtEditingId = null;
  document.getElementById('mapTextModal').classList.remove('open');
}
document.getElementById('mtDone').onclick = closeMapTextEditor;
document.getElementById('mtClose').onclick = closeMapTextEditor;
/* Enter = 다음 줄, ⌘/Ctrl+Enter = 확인 (2026-10-09 대표 지시) */
document.getElementById('mtText').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey) && !e.isComposing){ e.preventDefault(); closeMapTextEditor(); } });
document.getElementById('mtDelete').onclick = ()=>{
  document.getElementById('mtText').value = '';

};
document.getElementById('btnMapText').onclick = ()=>{

function afterCatsChanged(){
  saveCategories();
  const keys = new Set(CATEGORIES.map(c=>c.key));
  /* 🔴 없어진 분류를 쓰던 장소는 첫 분류로 옮긴다 — 안 그러면 필터에서 영영 안 보여
     「핀이 사라졌다」가 된다 (삭제는 막혀 있지만, 옛 데이터를 불러올 때도 생길 수 있다) */
  let orphan = 0;
  LOCATIONS.forEach(l=>{ if(!keys.has(l.category)){ l.category = CATEGORIES[0].key; orphan++; } });
  if(orphan){ saveState(); }
  /* 없어진 분류가 필터에 남아 있으면 지우고, 새로 생긴 것은 기본으로 켠다 */
  Array.from(activeCats).forEach(k=>{ if(!keys.has(k)) activeCats.delete(k); });
  CATEGORIES.forEach(c=>{ if(!activeCats.has(c.key)) activeCats.add(c.key); });

}

   이름표마다 «오른쪽 → 왼쪽 → 위 → 아래 → 대각선» 순서로 놓아 보고, 다른 이름표·핀 동그라미와 안 겹치는 첫 자리에 둔다.
   다 겹치면 가장 덜 겹치는 자리. 확대·축소·핀 이동·이름 변경 때마다 다시 계산한다. */
const LABEL_POS = {
  r:  'left:30px;right:auto;top:50%;bottom:auto;transform:translateY(-50%)',
  l:  'left:auto;right:30px;top:50%;bottom:auto;transform:translateY(-50%)',
  t:  'left:50%;right:auto;top:auto;bottom:30px;transform:translateX(-50%)',
  b:  'left:50%;right:auto;top:30px;bottom:auto;transform:translateX(-50%)',
  tr: 'left:18px;right:auto;top:auto;bottom:22px;transform:none',
  br: 'left:18px;right:auto;top:22px;bottom:auto;transform:none',
  tl: 'left:auto;right:18px;top:auto;bottom:22px;transform:none',
  bl: 'left:auto;right:18px;top:22px;bottom:auto;transform:none'
};
let labelLayoutTimer = null;
function scheduleLabelLayout(){ clearTimeout(labelLayoutTimer); labelLayoutTimer = setTimeout(layoutPinLabels, 60); }
function layoutPinLabels(){
  const pins = Array.from(document.querySelectorAll('#map .loc-marker')).filter(el=> el.offsetParent);
  const circles = pins.map(el=> el.getBoundingClientRect());
  const placed = [];
  /* 보이는 지도 영역 — 왼쪽 목록판·오른쪽 상세판 «밑»은 가려지므로 빼고 계산한다 (16번 이름표가 목록판 밑으로 숨었던 문제) */
  const mr = document.getElementById('map').getBoundingClientRect();
  const view = { left: mr.left, right: mr.right, top: mr.top, bottom: mr.bottom };
  const sb = document.getElementById('sidebar'); if(sb && sb.offsetParent){ const r = sb.getBoundingClientRect(); if(r.right > view.left && r.left <= view.left + 5) view.left = r.right; }
  const dp = document.getElementById('detailPanel'); if(dp && dp.classList.contains('open')){ const r = dp.getBoundingClientRect(); if(r.left < view.right && r.width < mr.width*0.9) view.right = r.left; }
  const outside = r => (r.right-r.left)*(r.bottom-r.top) - Math.max(0, Math.min(r.right,view.right)-Math.max(r.left,view.left)) * Math.max(0, Math.min(r.bottom,view.bottom)-Math.max(r.top,view.top));
  const area = (a,b)=> Math.max(0, Math.min(a.right,b.right)-Math.max(a.left,b.left)) * Math.max(0, Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
  pins.forEach((el, i)=>{
    const lb = el.querySelector('.pinLabel'); if(!lb) return;
    let best = null;
    for(const k of Object.keys(LABEL_POS)){
      lb.style.cssText = lb.style.cssText.replace(/(left|right|top|bottom|transform):[^;]*;?/g,'') + ';' + LABEL_POS[k];
      const r = lb.getBoundingClientRect(), pad = { left:r.left-2, right:r.right+2, top:r.top-2, bottom:r.bottom+2 };
      let hit = 0;
      placed.forEach(p=> hit += area(pad, p));
      circles.forEach((c, j)=>{ if(j !== i) hit += area(pad, c); });
      hit += outside(pad) * 3;   /* 가려지는 것은 겹치는 것보다 나쁘다 */
      if(!best || hit < best.hit) best = { k, hit };
      if(hit === 0) break;
    }
    lb.style.cssText = lb.style.cssText.replace(/(left|right|top|bottom|transform):[^;]*;?/g,'') + ';' + LABEL_POS[best.k];
    placed.push(lb.getBoundingClientRect());
  });
}

function haversineMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}

const GMAPS_KEY_STORAGE = 'scout2_gmaps_key';
/* 발행본은 파일에 박힌 키를 쓴다 — 구글 콘솔에서 «luvparklife.github.io 에서만 작동»

function getGmapsKey(){
  if(PUBLISHED && PUBLISHED.gmapsKey) return PUBLISHED.gmapsKey;
  /* V2 처음 열 때 — 261009 편집본에 넣어둔 키를 «그대로» 가져온다(같은 맥·같은 브라우저). 화면엔 안 찍는다 */
  let k = localStorage.getItem(GMAPS_KEY_STORAGE) || '';
  if(!k){ try{ k = localStorage.getItem('scout_gmaps_key_' + '261009') || ''; if(k) localStorage.setItem(GMAPS_KEY_STORAGE, k); }catch(e){} }
  return k;
}

/* ---- 구글 지도 JS API 동적 로드 (키가 있을 때만) ---- */
let gmapsLoadPromise = null;
function loadGoogleMaps(key){
  if(window.google && window.google.maps) return Promise.resolve(window.google);
  if(gmapsLoadPromise) return gmapsLoadPromise;
  gmapsLoadPromise = new Promise((resolve, reject)=>{
    window.__gmapsReady = ()=> resolve(window.google);
    const s = document.createElement('script');
    /* 지도 글자 언어를 같이 정한다 — 구글은 한 번 불러오면 언어를 못 바꾼다(바꾸려면 새로고침) */
    window.__gmapsLang = LANG;
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&language=${LANG}&region=KR&callback=__gmapsReady`;
    s.onerror = ()=>{ gmapsLoadPromise = null; reject(new Error('load fail')); };
    document.head.appendChild(s);
  });
  return gmapsLoadPromise;
}

function sunPosDeg(lat,lng,date){
  const p = SunCalc.getPosition(date, lat, lng);
  return { az: (p.azimuth*180/Math.PI + 180 + 360) % 360, alt: p.altitude*180/Math.PI };
}
function fovForZoom(z){
  if(!Number.isFinite(z)) z = 1;
  return Math.min(180, 180 / Math.pow(1.5, z));
}

function toLocalDatetimeInputValue(d){
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* 🔴 2026-10-09 대표 지시 「태양궤적 일단 빼고 작업하자」 — 로드뷰는 그대로 두고 «겹쳐 그리는 것»만 끈다.
   왜 뺐나 = 실제 구글 로드뷰 위에서 제대로 안 떴다. 클로드는 «가짜 로드뷰»로만 검증했고
   진짜 화면에서 확인하지 못한 채 「고쳤다」고 세 번 말했다(§3-0-B 위반).
   되살리기 = 이 줄을 true 로 바꾸면 코드는 전부 그대로 살아난다. */
const SUN_OVERLAY_ON = false;
let svPanorama = null, svLoc = null, svResizeBound = false;
function drawSunOverlay(){
  if(!SUN_OVERLAY_ON){
    const c = document.getElementById('svOverlay');
    if(c && c.getContext) c.getContext('2d').clearRect(0,0,c.width,c.height);
    return;
  }
  if(!svPanorama || !svLoc) return;
  const wrap = document.getElementById('svPanoWrap');
  const canvas = document.getElementById('svOverlay');
  const box = wrap.getBoundingClientRect();
  if(!box.width || !box.height) return; // 모달이 아직 화면에 자리잡기 전 — 곧 재시도로 다시 그려짐
  canvas.width = box.width; canvas.height = box.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const pov = svPanorama.getPov() || {};
  const heading = Number.isFinite(pov.heading) ? pov.heading : 0;
  const pitch = Number.isFinite(pov.pitch) ? pov.pitch : 0;
  const fovH = fovForZoom(svPanorama.getZoom());
  const fovV = fovH * (canvas.height / Math.max(canvas.width,1));

  function project(az, alt){
    const dAz = ((az - heading + 540) % 360) - 180;
    const x = canvas.width/2 + (dAz/(fovH/2)) * (canvas.width/2);
    const dAlt = alt - pitch;
    const y = canvas.height/2 - (dAlt/(fovV/2)) * (canvas.height/2);
    return { x, y, inView: Math.abs(dAz) <= fovH/2 + 8 };
  }

  const dateVal = getSelectedDateTime();
  if(document.getElementById('svShowPath').checked){
    const times = SunCalc.getTimes(dateVal, svLoc.lat, svLoc.lng);
    const start = (times.sunrise instanceof Date && !isNaN(times.sunrise)) ? times.sunrise.getTime()-30*60000 : dateVal.getTime()-6*3600000;
    const end = (times.sunset instanceof Date && !isNaN(times.sunset)) ? times.sunset.getTime()+30*60000 : dateVal.getTime()+6*3600000;
    ctx.beginPath();
    let started = false, lastInView = false;
    for(let tms=start; tms<=end; tms+=10*60000){
      const { az, alt } = sunPosDeg(svLoc.lat, svLoc.lng, new Date(tms));
      if(alt < -4) continue;
      const p = project(az, alt);
      if(!started || !lastInView && !p.inView){ ctx.moveTo(p.x,p.y); started = true; }
      else ctx.lineTo(p.x,p.y);
      lastInView = p.inView;
    }
    ctx.strokeStyle = 'rgba(245,182,63,.85)'; ctx.lineWidth = 2; ctx.stroke();
  }

  const cur = sunPosDeg(svLoc.lat, svLoc.lng, dateVal);
  const p = project(cur.az, cur.alt);
  if(cur.alt > -4){
    if(p.inView){
      ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI*2);
      ctx.fillStyle = '#ffd56b'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.font = 'bold 12px -apple-system,sans-serif'; ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(`${cur.alt.toFixed(0)}°`, p.x, p.y - 18);
    } else {
      /* 🔴 태양이 화면 밖이면 «빈 화면»이 된다 — 어느 쪽으로 돌려야 하는지 가장자리에 알려준다
         (2026-10-09 대표 신고 「아무 궤적이 안 뜬다」의 큰 원인) */
      const dAz = ((cur.az - heading + 540) % 360) - 180;
      const right = dAz > 0;
      const x = right ? canvas.width - 38 : 38;
      const y = canvas.height / 2;
      ctx.beginPath();
      ctx.moveTo(right ? x + 16 : x - 16, y);
      ctx.lineTo(right ? x - 10 : x + 10, y - 14);
      ctx.lineTo(right ? x - 10 : x + 10, y + 14);
      ctx.closePath();
      ctx.fillStyle = 'rgba(245,182,63,.92)'; ctx.fill();
      ctx.font = 'bold 12px -apple-system,sans-serif';
      ctx.fillStyle = '#ffd56b'; ctx.textAlign = 'center';
      ctx.fillText('☀ ' + Math.abs(Math.round(dAz)) + '°', x, y + 34);
    }
  }
  const belowTxt = cur.alt < 0 ? ` (${t('belowHorizon')})` : '';
  document.getElementById('svSunReadout').textContent =
    `☀️ ${t('altitude')} ${cur.alt.toFixed(0)}° · ${t('azimuth')} ${cur.az.toFixed(0)}°${belowTxt}`;
}

async function openStreetViewModal(loc){
  svLoc = loc;
  document.getElementById('svModalTitle').textContent = loc.title || t('noTitle');
  document.getElementById('svOpenNewTab').textContent = t('svOpenNewTab');
  document.getElementById('svOpenNewTab').href = `https://www.google.com/maps?layer=c&cbll=${loc.lat},${loc.lng}`;
  document.getElementById('svShowPathLabel').textContent = t('svShowPathLabel');
  document.getElementById('svDateTime').value = toLocalDatetimeInputValue(new Date());
  if(!SUN_OVERLAY_ON){
    ['svDateTime','svSunReadout'].forEach(id=>{ const e=document.getElementById(id); if(e) e.style.display='none'; });
    const lab = document.querySelector('.svPathToggle'); if(lab) lab.style.display='none';
  }
  document.getElementById('svNoKeyMsg').style.display = 'none';
  document.getElementById('svModal').classList.add('open');

  const key = getGmapsKey();
  if(!key){
    document.getElementById('svModal').classList.remove('open');
    openGmapsKeyModal();
    return;
  }
  try{ await loadGoogleMaps(key); }
  catch(e){
    document.getElementById('svNoKeyMsg').textContent = t('gmapsLoadFail');
    document.getElementById('svNoKeyMsg').style.display = 'flex';
    return;
  }
  if(!svPanorama){
    svPanorama = new google.maps.StreetViewPanorama(document.getElementById('svPano'), {
      position: { lat: loc.lat, lng: loc.lng },
      pov: { heading: SUN_OVERLAY_ON ? sunPosDeg(loc.lat, loc.lng, getSelectedDateTime()).az : 0, pitch: 0 }, zoom: 1,
      addressControl: false, fullscreenControl: false, motionTracking: false, motionTrackingControl: false
    });
    svPanorama.addListener('pov_changed', drawSunOverlay);
    svPanorama.addListener('zoom_changed', drawSunOverlay);
    svPanorama.addListener('status_changed', ()=>{
      if(svPanorama.getStatus() !== 'OK'){
        document.getElementById('svNoKeyMsg').textContent = t('noStreetView');
        document.getElementById('svNoKeyMsg').style.display = 'flex';
      } else {
        document.getElementById('svNoKeyMsg').style.display = 'none';
        drawSunOverlay();
      }
    });
  } else {
    svPanorama.setPosition({ lat: loc.lat, lng: loc.lng });
    if(SUN_OVERLAY_ON){
      const s0 = sunPosDeg(loc.lat, loc.lng, getSelectedDateTime());
      svPanorama.setPov({ heading: s0.az, pitch: 10 });
    }
  }
  if(!svResizeBound){
    window.addEventListener('resize', ()=>{ if(document.getElementById('svModal').classList.contains('open')) drawSunOverlay(); });
    svResizeBound = true;
  }
  // 🔴 로드뷰가 뜨는 속도가 매번 달라 단 한 번의 타이머로는 못 믿는다 — 몇 번 더 다시 그려서 맞춘다
  [100, 400, 900, 1800].forEach(ms => setTimeout(drawSunOverlay, ms));
}
document.getElementById('svMovePinBtn').onclick = ()=>{
  if(!svPanorama || !svLoc){ flashError(t('svMovePinFail')); return; }
  const pos = svPanorama.getPosition();
  if(!pos){ flashError(t('svMovePinFail')); return; }
  const lat = pos.lat(), lng = pos.lng();
  svLoc.lat = lat; svLoc.lng = lng;
  const m = markers[svLoc.id]; if(m) m.setLatLng([lat, lng]);
  if(currentLocId === svLoc.id) updateCoordHint(svLoc);
  refreshDistancesIfOpen();
  drawSunOverlay();
  saveState();
  flashSaved();
};

  sendToUnsorted(loc.media);

  document.getElementById('detailPanel').classList.remove('open');
