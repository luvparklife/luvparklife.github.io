/* 🔴 Sunseeker 사진은 «따로 위에» 모은다 (2026-10-09 대표 지시) — 일반 사진에 섞이면
   「해가 어디로 가나」를 보려고 할 때마다 찾아야 한다. 사진마다 메모도 여기서 적는다. */
let mediaDrag = null;   /* {fromLocId, idx} */
/* 📚 라이브러리(핀에 안 들어간 사진)에서 끌어온 것도 핀 사진처럼 다룬다 — 출발지만 다르다 */
function dragFromLoc_(){
  if(!mediaDrag) return null;
  if(mediaDrag.fromLocId === '__lib__') return { id:'__lib__', media: V2EDIT ? (PUBLISHED.unsorted = PUBLISHED.unsorted || []) : loadUnsorted() };
  return LOCATIONS.find(l=>l.id===mediaDrag.fromLocId);
}
function moveMediaTo(targetLocId){
  if(!mediaDrag) return;
  if(mediaDrag.items) return libDropMany_(LOCATIONS.find(l=>l.id===targetLocId), null, null);
  const from = dragFromLoc_();
  const to   = LOCATIONS.find(l=>l.id===targetLocId);
  if(!from || !to || from.id === to.id){ mediaDrag = null; return; }
  const item = from.media[mediaDrag.idx];
  if(!item){ mediaDrag = null; return; }
  from.media.splice(mediaDrag.idx, 1);
  to.media.push(item);
  if(from.id === '__lib__') saveUnsorted(from.media);
  mediaDrag = null;
  document.body.classList.remove('media-dragging');
  if(currentLocId != null){
    const cur = LOCATIONS.find(l=>l.id===currentLocId);
    if(cur) renderDpMedia(cur);
  }
  renderList(); renderPhotoGrid(); saveState();
  flashSaved();
}
function bindMediaDrop(el, locId){
  if(!el) return;
  el.addEventListener('dragover', (ev)=>{
    if(!mediaDrag) return;
    ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
    el.classList.add('dropTarget');
  });
  el.addEventListener('dragleave', ()=> el.classList.remove('dropTarget'));
  el.addEventListener('drop', (ev)=>{
    if(!mediaDrag) return;
    ev.preventDefault(); ev.stopPropagation();
    el.classList.remove('dropTarget');
    moveMediaTo(locId);
  });
}
/* 🔴 핀에서 빠지는 사진은 «버리지 않는다» — 미분류 칸으로 보낸다 (2026-10-09 대표 신고로 발견:
   #13 핀을 지우자 거기 있던 Sunseeker 7장·사진 1장이 같이 사라졌다) */
/* 🗄 관리자 웹 편집에서 뺀 사진은 «미분류»가 아니라 드라이브 「보관함」 폴더로 (지도 화면에선 사라진다)
   2026-10-09 대표: 「아카이브 폴더는 평상시에는 안 보이고 원본 폴더 들어가야 보이는 거지. 로케이션 맵에서는 없어져야」 */
function v2DriveId(u){ const m = /\/d\/([A-Za-z0-9_\-]{20,})/.exec(u || ''); return m ? m[1] : ''; }
function v2Archive(mediaArr, from){
  const items = mediaArr.map(m => ({
    file: (m.file || (m.url || '').split('/').pop() || '').replace(/=w\d+$/, ''), type: m.type, from: from || '',
    id: m.drive || (m.type === 'video' ? '' : v2DriveId(m.url)), thumb: v2DriveId(m.thumb), caption: m.caption || ''
  }));
  PUBLISHED.archive = (PUBLISHED.archive || []).concat(items.map(x => Object.assign({ at: new Date().toISOString() }, x)));
  v2Call(v2Auth({ action:'editArchive', items })).catch(e => v2Toast('⚠ ' + t('v2ArchiveFail') + ' (' + e.message + ')', 'err'));
  return items.length;
}
function toggleLib(force){
  const pnl = document.getElementById('libPanel');
  const on = (force === undefined) ? !pnl.classList.contains('open') : force;
  pnl.classList.toggle('open', on); if(on) renderLib();
}
function renderLib(){
  const pnl = document.getElementById('libPanel'); if(!pnl || !V2EDIT) return;
  const lib = PUBLISHED.unsorted = PUBLISHED.unsorted || [];
  document.getElementById('libTitle').textContent = t('btnLibrary')(lib.length);
  document.getElementById('libHint').textContent = t('libHint');
  document.getElementById('libUpload').textContent = t('v2AdminUpload');
  if(!LIB_SEL) LIB_SEL = new Set();
  [...LIB_SEL].forEach(x => { if(!lib.includes(x)) LIB_SEL.delete(x); });   /* 사라진 것은 선택에서도 뺀다 */
  document.getElementById('libCount').textContent = t('libSelCount')(LIB_SEL.size);
  document.getElementById('libSelAll').textContent = t('libSelAll');
  document.getElementById('libSelNone').textContent = t('libSelNone');
  const del = document.getElementById('libDelSel'); del.textContent = t('libDelSel')(LIB_SEL.size); del.disabled = !LIB_SEL.size;
  const g = document.getElementById('libGrid'); g.innerHTML = '';
  if(!lib.length){ g.innerHTML = `<div class="libEmpty">${t('libEmpty')}</div>`; return; }
  /* 📷 사진 / 🎬 영상 으로 나눠서 (idx 는 라이브러리 원래 번호 그대로 — 끌기·삭제가 그 번호로 간다) */
  const order = lib.map((m, idx)=>({ m, idx }));
  const photos = order.filter(x => x.m.type !== 'video'), videos = order.filter(x => x.m.type === 'video');
  const head = (txt)=>{ const h = document.createElement('div'); h.className = 'libSec'; h.textContent = txt; g.appendChild(h); };
  const groups = [[t('lblPhotoMedia')(photos.length), photos], [t('lblVideoMedia')(videos.length), videos]];
  groups.forEach(([title, arr])=>{ if(!arr.length) return; head(title); arr.forEach(({ m, idx })=> libChip_(m, idx)); });
  function libChip_(m, idx){
    const c = document.createElement('div'); c.className = 'libChip' + (LIB_SEL.has(m) ? ' sel' : ''); c.draggable = true; c.title = (m.file || '') + ' — ' + t('libHint');
    c.innerHTML = `<img src="${m.thumb || m.url}" alt=""><span class="lcChk">${LIB_SEL.has(m) ? '✓' : ''}</span><button class="lcBtn lcView" title="크게">🔍</button><button class="lcBtn lcDel" title="${t('libDelTitle')}">🗑</button>`
      + `<span class="lcType">${m.type === 'video' ? '🎬' : (isSunM(m) ? '☀️' : '📷')}</span>`;
    /* 한 번 누르면 체크 / 끄기 — 여러 장 골라서 한꺼번에 끌거나 보관함으로 */
    c.addEventListener('click', ()=>{ LIB_SEL.has(m) ? LIB_SEL.delete(m) : LIB_SEL.add(m); renderLib(); });
    c.addEventListener('dragstart', ev=>{
      /* 체크된 사진을 끌면 «체크된 것 전부»가 같이 간다 */
      if(LIB_SEL.has(m) && LIB_SEL.size > 1) mediaDrag = { fromLocId:'__lib__', items: lib.filter(x => LIB_SEL.has(x)) };
      else mediaDrag = { fromLocId:'__lib__', idx };
      ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain','lib'); document.body.classList.add('media-dragging');
    });
    c.addEventListener('dragend', ()=>{ mediaDrag = null; document.body.classList.remove('media-dragging'); });
    const view = ()=> openLightboxItems(lib, idx, t('btnLibrary')(lib.length));
    c.querySelector('.lcView').onclick = (ev)=>{ ev.stopPropagation(); view(); };
    c.addEventListener('dblclick', (ev)=>{ ev.preventDefault(); view(); });
    c.querySelector('.lcDel').onclick = (ev)=>{
      ev.stopPropagation();
      if(!confirm(t('libDelConfirm'))) return;
      const it = lib.splice(idx, 1);
      v2Archive(it, '(라이브러리에서 뺌)');
      saveUnsorted(lib); v2Toast('🗄 ' + t('libArchived'), 'ok');
    };
    g.appendChild(c);
  }
}
document.getElementById('libClose').onclick = ()=> toggleLib(false);
var LIB_SEL = new Set();   /* var — 처음 그릴 때 먼저 불려도 멈추지 않게 */
document.getElementById('libSelAll').onclick = ()=>{ (PUBLISHED.unsorted || []).forEach(m => LIB_SEL.add(m)); renderLib(); };
document.getElementById('libSelNone').onclick = ()=>{ LIB_SEL.clear(); renderLib(); };
document.getElementById('libDelSel').onclick = ()=>{
  const lib = PUBLISHED.unsorted || []; const pick = lib.filter(m => LIB_SEL.has(m));
  if(!pick.length || !confirm(t('libDelSelConfirm')(pick.length))) return;
  PUBLISHED.unsorted = lib.filter(m => !LIB_SEL.has(m)); LIB_SEL.clear();
  v2Archive(pick, '(라이브러리에서 뺌)'); saveUnsorted(PUBLISHED.unsorted); v2Toast('🗄 ' + t('libArchived'), 'ok');
};
/* 여러 장을 한꺼번에 핀에 넣기 — before 가 있으면 그 사진 앞에, 없으면 맨 뒤 */
function libDropMany_(loc, kind, before){
  const items = (mediaDrag && mediaDrag.items) || [];
  mediaDrag = null; document.body.classList.remove('media-dragging');
  if(!loc || !items.length) return;
  PUBLISHED.unsorted = (PUBLISHED.unsorted || []).filter(m => !items.includes(m));
  items.forEach(m => { LIB_SEL.delete(m); if(kind){ if(m.type === 'video') m.sun = (kind === 'sun'); else m.type = (kind === 'sun') ? 'sunseeker' : 'image'; } });
  let at = before ? loc.media.indexOf(before) : -1; if(at < 0) at = loc.media.length;
  loc.media.splice(at, 0, ...items);
  saveUnsorted(PUBLISHED.unsorted);
  if(currentLocId === loc.id) renderDpMedia(loc);
  renderList(); renderPhotoGrid(); saveState(); flashSaved();
}
/* 🔁 방금 올린 드라이브 사진은 미리보기가 준비되기까지 몇 초 걸린다 — 그 사이 못 받은 그림은 2초 간격으로 5번 다시 받는다
   (2026-10-09 시험: 올리자마자 라이브러리 썸네일이 가끔 깨진 채로 남았다) */
document.addEventListener('error', ev=>{
  const img = ev.target;
  if(!img || img.tagName !== 'IMG' || !/googleusercontent\.com\/d\//.test(img.src)) return;
  const n = Number(img.dataset.retry || 0); if(n >= 5) return;
  img.dataset.retry = n + 1;
  const base = img.src.replace(/[?&]r=\d+$/, '');
  setTimeout(()=>{ img.src = base + (base.includes('?') ? '&' : '?') + 'r=' + (n + 1); }, 2000);
}, true);
function sendToUnsorted(mediaArr){
  if(!mediaArr || !mediaArr.length) return 0;
  if(V2EDIT){
    /* 관리자 웹 편집: 핀에서 뺀 사진은 📚 라이브러리로(주소·표시 그대로). 정말 필요 없으면 라이브러리에서 🗑 → 드라이브 보관함 */
    const lib = PUBLISHED.unsorted = PUBLISHED.unsorted || [];
    mediaArr.forEach(m => lib.push(Object.assign({ file: (m.file || (m.url || '').split('/').pop() || '') }, m)));
    saveUnsorted(lib);
    return mediaArr.length;
  }
  const uns = loadUnsorted();
  const have = new Set(uns.map(e=>e.file));
  let n = 0;
  mediaArr.forEach(m=>{
    const fn = (m.url||'').split('/').pop(); if(!fn || have.has(fn)) return;
    /* 🔴 Sunseeker 표시를 지우지 않는다 (2026-10-09 — 전엔 image 로 바꿔서, 미분류에서 다시 끌어오면 일반 사진이 됐다) */
    uns.push(Object.assign({ file: fn, type: (m.type === 'video' || m.type === 'sunseeker') ? m.type : 'image', lat: null, lng: null }, m.sun ? { sun:true } : {},
      m.thumb ? { url: m.url, thumb: m.thumb } : {}, m.drive ? { drive: m.drive } : {}, m.caption ? { caption: m.caption } : {}, m.marks ? { marks: m.marks } : {}));   /* V2: 드라이브 주소·표시를 들고 간다 */
    have.add(fn); n++;
  });
  saveUnsorted(uns);
  return n;
}
/* ☀️ Sunseeker 인가 — 사진은 종류가 sunseeker, 영상은 sun 표시 */
function isSunM(m){ return !!m && (m.type === 'sunseeker' || (m.type === 'video' && m.sun === true)); }
function renderDpMedia(loc){
  const sunIdx = [], otherIdx = [], vidIdx = [];
  loc.media.forEach((m, i)=> (isSunM(m) ? sunIdx : (m.type === 'video' ? vidIdx : otherIdx)).push(i));
  renderMediaGroup_(document.getElementById('dpMediaGridSun'), loc, sunIdx);
  renderMediaGroup_(document.getElementById('dpMediaGrid'), loc, otherIdx);
  renderMediaGroup_(document.getElementById('dpMediaGridVid'), loc, vidIdx);
  document.getElementById('lblVideoMedia').textContent = t('lblVideoMedia')(vidIdx.length);
  document.getElementById('lblMedia').textContent = t('lblPhotoMedia')(otherIdx.length);
  document.getElementById('dpVideoWrap').style.display = (vidIdx.length || editMode) ? 'block' : 'none';
  if(editMode && !vidIdx.length) document.getElementById('dpMediaGridVid').innerHTML = `<div class="sunDropEmpty" style="grid-column:1/-1;border-color:var(--border)">${t('vidEmpty')}</div>`;
  /* ☀️ 편집 중엔 비어 있어도 칸을 보여준다 — 사진을 여기로 끌어다 놓으면 Sunseeker 가 된다 (2026-10-09 대표 지시) */
  const sunGrid = document.getElementById('dpMediaGridSun');
  if(editMode && !sunIdx.length){
    sunGrid.innerHTML = `<div class="sunDropEmpty" style="grid-column:1/-1">${t('sunDropHint')}</div>`;
  }
  document.getElementById('dpSunGroupWrap').style.display = (sunIdx.length || editMode) ? 'block' : 'none';
}
/* 상세패널의 「☀️ Sunseeker」·「미디어」 구역에 놓으면 종류가 바뀐다. 다른 핀에서 끌어오면 옮겨지면서 바뀐다. */
function dropMediaAsKind(kind){
  if(!mediaDrag || currentLocId == null) return;
  if(mediaDrag.items) return libDropMany_(LOCATIONS.find(l=>l.id===currentLocId), kind, null);
  const from = dragFromLoc_();
  const to   = LOCATIONS.find(l=>l.id===currentLocId);
  const item = from && from.media[mediaDrag.idx];
  mediaDrag = null; document.body.classList.remove('media-dragging');
  if(!item || !to) return;
  if(from.id !== to.id){ from.media.splice(from.media.indexOf(item), 1); to.media.push(item); if(from.id === '__lib__') saveUnsorted(from.media); }
  /* 🎬 Sunseeker 화면 녹화(영상)도 ☀️ 칸에 들어간다 — 영상은 종류는 그대로 두고 sun 표시만 단다 (2026-10-09 대표 신고) */
  if(item.type === 'video') item.sun = (kind === 'sun'); else item.type = (kind === 'sun') ? 'sunseeker' : 'image';
  renderDpMedia(to); renderList(); renderPhotoGrid(); saveState(); flashSaved();
}
function bindKindDrop_(el, kind){
  if(!el) return;
  el.addEventListener('dragover', ev=>{ if(!mediaDrag) return; ev.preventDefault(); ev.dataTransfer.dropEffect='move'; el.classList.add('dropTarget'); });
  el.addEventListener('dragleave', ev=>{ if(!el.contains(ev.relatedTarget)) el.classList.remove('dropTarget'); });
  el.addEventListener('drop', ev=>{ if(!mediaDrag) return; ev.preventDefault(); ev.stopPropagation(); el.classList.remove('dropTarget'); dropMediaAsKind(kind); });
}
bindKindDrop_(document.getElementById('dpSunGroupWrap'), 'sun');
bindKindDrop_(document.getElementById('dpMediaGrid').closest('.dp-section'), 'photo');
bindKindDrop_(document.getElementById('dpVideoWrap'), 'photo');   /* 영상 칸에 놓아도 «Sunseeker 아님» — 영상이면 여기, 사진이면 사진 칸으로 간다 */
function reorderMediaTo(loc, targetIdx, kind){
  if(mediaDrag && mediaDrag.items) return libDropMany_(loc, kind, loc.media[targetIdx]);
  const from = dragFromLoc_();
  const item = from && from.media[mediaDrag.idx];
  const srcIdx = mediaDrag.idx;
  mediaDrag = null; document.body.classList.remove('media-dragging');
  if(!item || (from.id === loc.id && srcIdx === targetIdx)) return;
  const target = loc.media[targetIdx];
  from.media.splice(srcIdx, 1);
  if(from.id === '__lib__') saveUnsorted(from.media);
  let at = loc.media.indexOf(target);                         /* 빼고 나서 다시 찾는다(번호가 밀린다) */
  if(from.id === loc.id && srcIdx < targetIdx) at += 1;       /* 오른쪽으로 끌었으면 그 사진 «뒤» */
  loc.media.splice(Math.max(0, at), 0, item);
  if(item.type === 'video') item.sun = (kind === 'sun'); else item.type = (kind === 'sun') ? 'sunseeker' : 'image';
  renderDpMedia(loc); renderList(); renderPhotoGrid(); saveState(); flashSaved();
}
function renderMediaGroup_(grid, loc, indices){
  grid.innerHTML = '';
  indices.forEach(idx=>{
    const m = loc.media[idx];
    const badge = (m.type === 'video' && m.sun) ? '☀️ ' + (t('typeBadge').video || 'video') : (t('typeBadge')[m.type] || m.type);
    const cell = document.createElement('div');
    cell.className = 'mediaCell';
    const card = document.createElement('div');
    card.className = 'mediaThumb';
    if(editMode){
      /* 🔴 상세패널 사진을 «목록의 다른 장소»나 «지도 핀» 위로 끌어다 놓으면 그리로 옮겨진다
         (2026-10-09 대표 지시 — 리뷰 모달까지 안 가고 바로 옮기게) */
      card.draggable = true;
      card.addEventListener('dragstart', (ev)=>{
        mediaDrag = { fromLocId: loc.id, idx: idx };
        card.classList.add('dragging');
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain','media');
        document.body.classList.add('media-dragging');
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        document.body.classList.remove('media-dragging');
        mediaDrag = null;
      });
    }
    card.innerHTML = `
      <img src="${thumbFor(m)}" alt="">
      ${m.type==='video' ? '<span class="mPlay">▶</span>' : ''}
      ${(m.marks && m.marks.length) ? '<span class="mAnnoTag">✏️</span>' : ''}
      <span class="mTypeBadge">${badge}</span>
      ${editMode ? `<button class="mRemove" title="✕">✕</button>` : ''}
    `;
    card.onclick = ()=> openLightbox(loc.id, idx);
    if(editMode){
      card.querySelector('.mRemove').onclick = (ev)=>{
        ev.stopPropagation();
        sendToUnsorted(loc.media.splice(idx,1));
        renderDpMedia(loc); renderList(); renderPhotoGrid(); saveState();
      };
      if(m.type !== 'video'){
        const b = card.querySelector('.mTypeBadge');
        b.style.cursor = 'pointer'; b.title = t('typeToggleTitle');
        b.onclick = (ev)=>{
          ev.stopPropagation();
          m.type = (m.type==='sunseeker') ? 'image' : 'sunseeker';
          renderDpMedia(loc); saveState();
        };
      }
    }
    cell.appendChild(card);
    /* ↔ 2026-10-09 대표 지시 「사진 순서 바꿀 수 있게」 — 다른 사진 위에 놓으면 그 자리로.
       오른쪽으로 끌면 그 사진 «뒤», 왼쪽으로 끌면 «앞». 다른 핀에서 끌어와도 그 자리에 들어간다.
       ☀️ 칸 안에 놓으면 Sunseeker, 미디어 칸에 놓으면 일반(영상은 ☀️ 표시만) — 칸에 놓을 때와 같은 규칙 */
    if(editMode){
      const kind = grid.id === 'dpMediaGridSun' ? 'sun' : 'photo';
      const after = ()=> mediaDrag && mediaDrag.fromLocId === loc.id && mediaDrag.idx < idx;
      cell.addEventListener('dragover', ev=>{
        if(!mediaDrag) return;
        ev.preventDefault(); ev.stopPropagation(); ev.dataTransfer.dropEffect = 'move';
        cell.classList.toggle('reorderAfter', after()); cell.classList.toggle('reorderBefore', !after());
      });
      cell.addEventListener('dragleave', ev=>{ if(!cell.contains(ev.relatedTarget)) cell.classList.remove('reorderAfter','reorderBefore'); });
      cell.addEventListener('drop', ev=>{
        if(!mediaDrag) return;
        ev.preventDefault(); ev.stopPropagation();
        cell.classList.remove('reorderAfter','reorderBefore');
        reorderMediaTo(loc, idx, kind);
      });
    }

    const cap = document.createElement('input');
    cap.type = 'text'; cap.className = 'mCaption';
    cap.value = m.caption || '';
    cap.placeholder = t('captionPlaceholder');
    cap.readOnly = !editMode;
    cap.addEventListener('input', debounce(function(){
      m.caption = this.value; saveState();
    }, 350));
    cell.appendChild(cap);

    const suns = loc.media.filter(x => isSunM(x));
    if(SUN_PAIR_ON && m.type === 'image' && suns.length){
      const fn = u => (u||'').split('/').pop();
      if(editMode){
        const sel = document.createElement('select');
        sel.className = 'mPair';
        sel.innerHTML = `<option value="">${t('pairNone')}</option>` + suns.map((x,i)=>{
          const f = fn(x.url);
          return `<option value="${escapeHtml(f)}" ${m.pair===f?'selected':''}>☀️ ${escapeHtml(x.caption || ('Sunseeker ' + (i+1)))}</option>`;
        }).join('');
        sel.onchange = ()=>{ if(sel.value) m.pair = sel.value; else delete m.pair; saveState(); };
        cell.appendChild(sel);
      } else if(m.pair){
        const tag = document.createElement('div'); tag.className = 'mPairTag';
        const hit = suns.find(x => fn(x.url) === m.pair);
        tag.textContent = '☀️ ' + (hit && hit.caption ? hit.caption : 'Sunseeker');
        cell.appendChild(tag);
      }
    }

    grid.appendChild(cell);
  });
}
function reverseGeocode(loc){
  const statusEl = document.getElementById('dpAddrStatus');
  if(currentLocId===loc.id) statusEl.textContent = t('geoLoading');
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${loc.lat}&lon=${loc.lng}&accept-language=${LANG}&zoom=18`)
    .then(r=>r.json())
    .then(data=>{
      if(data && data.display_name && !loc.address){
        loc.address = data.display_name;
        if(currentLocId===loc.id){ document.getElementById('dpAddressInput').value = loc.address; statusEl.textContent = t('geoOk'); }
        renderList(); saveState();
      } else if(currentLocId===loc.id){ statusEl.textContent=''; }
    })
    .catch(()=>{ if(currentLocId===loc.id) statusEl.textContent = t('geoFail'); });
}

/* 🔴 라이트박스를 «장소에 매이지 않게» 일반화했다 (2026-10-09) —
   사진 옮기기 화면의 「미분류」는 LOCATIONS 에 없어서, 전처럼 장소 id 로만 열면 못 본다. */
let lbItems = [], lbTitle = '', lbIndex = 0;
function openLightboxItems(items, index, title){
  if(!items || !items.length) return;
  lbItems = items; lbIndex = index || 0; lbTitle = title || '';
  document.getElementById('lightbox').classList.add('open');

}
function closeLightbox(){ stopAnnotating_(); document.getElementById('lightbox').classList.remove('open'); document.getElementById('lbStageInner').innerHTML=''; }

/* ✏️ 사진 위 표시 (2026-10-09 대표 지시 「사진에 마킹이나 텍스트 입력해서 편집」)
   🔴 사진 파일은 안 고친다 — 선·글자를 사진 «위에» 얹어 media.marks 에 저장한다(좌표는 0~1 비율).
      그래서 원본은 그대로 남고, 지우면 깨끗이 돌아간다. 「받기」를 누르면 표시를 합친 그림이 내려받아진다. */
let annoOn = false, annoTool = 'pen', annoDraft = null;
let annoEdit = null;   /* 글자 입력칸 {media, idx(-1=새 글자), x, y, c, ta} */
let annoMove = null;   /* 글자 끌기 {i, px, py, ox, oy, moved} */
/* 🅣 글자는 사진 위에서 «바로» 친다 (2026-10-09 대표 지시 「글자 쓰면 이동하고 수정하고 다음칸으로 넘어가고 다 되야지」)
   · Enter = 다음 줄 · 바깥 클릭/완료/⌘Enter/Esc = 끝 · 글자를 끌면 옮겨지고, 한 번 누르면 다시 고친다
   🔴 치는 동안엔 화면을 다시 그리지 않는다 — 한글 조합이 끊기지 않게(CLAUDE.md §3-5 ⑧) */
function openTextEditor_(media, x, y, c, idx){
  commitTextEditor_();
  const wrap = document.querySelector('#lbStageInner .lbImgWrap'); if(!wrap) return;
  const r = wrap.querySelector('img').getBoundingClientRect();
  const z = idx >= 0 ? (media.marks[idx].z || 0.045) : Number(document.getElementById('annoSize').value) || 0.045;
  const fs = r.width * z;
  const ta = document.createElement('textarea');
  ta.className = 'annoTa';
  ta.value = idx >= 0 ? (media.marks[idx].s || '') : '';
  ta.placeholder = t('annoTextPrompt');
  ta.style.left = (x * r.width) + 'px';
  ta.style.top = (y * r.height - fs * 0.95) + 'px';
  ta.style.fontSize = fs + 'px';
  ta.style.color = c;
  ta.addEventListener('keydown', ev=>{
    ev.stopPropagation();   /* ←→·Esc 가 사진 넘김/닫기로 새지 않게 */
    if(ev.isComposing) return;
    if(ev.key === 'Escape' || ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter')){ ev.preventDefault(); commitTextEditor_(); }
  });
  ta.addEventListener('pointerdown', ev=> ev.stopPropagation());
  ta.addEventListener('blur', ev=>{
    /* 색 고르기 등 도구줄을 누른 건 «끝»이 아니다 — 입력칸을 남겨 둔다 */
    if(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('#lbAnnoBar') && ev.relatedTarget.id !== 'annoDone') return;
    setTimeout(()=>{ if(annoEdit && annoEdit.ta === ta) commitTextEditor_(); }, 0);
  });
  wrap.appendChild(ta);
  annoEdit = { media, idx, x, y, c, z, ta };
  document.getElementById('annoSize').value = String(z);
  drawAnno_(media);
  setTimeout(()=>{ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
}
function commitTextEditor_(){
  if(!annoEdit) return;
  const e = annoEdit; annoEdit = null;
  const s = e.ta.value.replace(/\s+$/, '');
  e.ta.remove();
  const marks = (e.media.marks = e.media.marks || []);
  if(e.idx >= 0){
    if(s.trim()){ marks[e.idx].s = s; marks[e.idx].c = e.c; marks[e.idx].z = e.z; } else marks.splice(e.idx, 1);   /* 비우면 지워진다 */
  } else if(s.trim()){
    marks.push({ t:'text', x:e.x, y:e.y, s, c:e.c, z:e.z });
  }
  saveState(); drawAnno_(e.media);
}
function annoMedia_(){ return lbItems[lbIndex]; }
function annoSvg_(){ return document.querySelector('#lbStageInner svg.annoLayer'); }
function shapeSvg_(m, W, H, idx){
  const c = m.c || '#ff3b30', sw = Math.max(2, W * 0.006);
  if(m.t === 'pen'){
    const d = m.pts.map((p,i)=> (i?'L':'M') + (p[0]*W).toFixed(1) + ' ' + (p[1]*H).toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  if(m.t === 'circle'){
    const cx=(m.x1+m.x2)/2*W, cy=(m.y1+m.y2)/2*H, rx=Math.abs(m.x2-m.x1)/2*W, ry=Math.abs(m.y2-m.y1)/2*H;
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${c}" stroke-width="${sw}"/>`;
  }
  if(m.t === 'arrow'){
    const x1=m.x1*W, y1=m.y1*H, x2=m.x2*W, y2=m.y2*H, a=Math.atan2(y2-y1,x2-x1), h=sw*4.5;
    const p1=[x2-h*Math.cos(a-0.45), y2-h*Math.sin(a-0.45)], p2=[x2-h*Math.cos(a+0.45), y2-h*Math.sin(a+0.45)];
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`
         + `<polygon points="${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="${c}"/>`;
  }
  if(m.t === 'text'){
    /* 여러 줄 — 줄마다 tspan (Enter 로 다음 줄) */
    const fs = W * (m.z || 0.045), x = m.x*W;   /* m.z = 글자 크기(사진 폭 대비) */
    const lines = String(m.s||'').split('\n').map((ln,k)=> `<tspan x="${x}" dy="${k ? fs*1.2 : 0}">${escapeHtml(ln) || ' '}</tspan>`).join('');
    return `<text data-i="${idx==null?'':idx}" x="${x}" y="${m.y*H}" fill="${c}" font-size="${fs}" font-weight="800" stroke="#000" stroke-width="${fs*0.08}" paint-order="stroke" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">${lines}</text>`;
  }
  return '';
}
function drawAnno_(media){
  const svg = annoSvg_(); if(!svg) return;
  const img = svg.parentNode.querySelector('img');
  const W = img.naturalWidth || 1000, H = img.naturalHeight || 1000;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  const marks = media.marks || [];
  const editing = (annoEdit && annoEdit.media === media) ? annoEdit.idx : -1;   /* 고치는 중인 글자는 입력칸이 대신 보인다 */
  svg.innerHTML = marks.map((m,i)=> i === editing ? '' : shapeSvg_(m, W, H, i)).join('')
                + (annoDraft ? shapeSvg_(annoDraft, W, H) : '');
}
function annoPoint_(ev){
  const r = annoSvg_().getBoundingClientRect();
  return [Math.min(1,Math.max(0,(ev.clientX - r.left)/r.width)), Math.min(1,Math.max(0,(ev.clientY - r.top)/r.height))];
}
function startAnnotating_(){
  const media = annoMedia_(); if(!media) return;
  annoOn = true;
  document.querySelector('#lbStageInner .lbImgWrap').classList.add('annotating');
  document.getElementById('lbAnnoBar').classList.add('open');
  document.querySelectorAll('#lbAnnoBar [data-tool]').forEach(b=> b.classList.toggle('on', b.dataset.tool===annoTool));
  const svg = annoSvg_();
  svg.onpointerdown = (ev)=>{
    ev.preventDefault(); ev.stopPropagation();
    if(annoEdit){ commitTextEditor_(); return; }          /* 쓰는 중 바깥을 누르면 = 끝내기만 */
    const [x,y] = annoPoint_(ev), c = document.getElementById('annoColor').value;
    /* 글자 «덩어리» 전체를 누를 수 있게 — 글자 사이·줄 사이 빈틈을 눌러도 잡힌다 */
    const hit = Array.from(svg.querySelectorAll('text[data-i]')).reverse().find(el=>{
      const r = el.getBoundingClientRect(), pad = 6;
      return ev.clientX >= r.left-pad && ev.clientX <= r.right+pad && ev.clientY >= r.top-pad && ev.clientY <= r.bottom+pad;
    });
    if(hit && hit.dataset.i !== ''){                      /* 이미 쓴 글자 — 끌면 이동, 누르면 고치기 */
      const i = Number(hit.dataset.i), m = media.marks[i];
      svg.setPointerCapture(ev.pointerId);
      annoMove = { i, px:x, py:y, ox:m.x, oy:m.y, moved:false };
      return;
    }
    if(annoTool === 'text'){ openTextEditor_(media, x, y, c, -1); return; }
    svg.setPointerCapture(ev.pointerId);
    annoDraft = annoTool === 'pen' ? { t:'pen', pts:[[x,y]], c } : { t:annoTool, x1:x, y1:y, x2:x, y2:y, c };
    drawAnno_(media);
  };
  svg.onpointermove = (ev)=>{
    if(annoMove){
      const [x,y] = annoPoint_(ev), m = media.marks[annoMove.i];
      if(Math.abs(x-annoMove.px) + Math.abs(y-annoMove.py) > 0.006) annoMove.moved = true;
      if(annoMove.moved){ m.x = annoMove.ox + (x-annoMove.px); m.y = annoMove.oy + (y-annoMove.py); drawAnno_(media); }
      return;
    }
    if(!annoDraft) return;
    const [x,y] = annoPoint_(ev);
    if(annoDraft.t === 'pen') annoDraft.pts.push([+x.toFixed(4), +y.toFixed(4)]); else { annoDraft.x2 = x; annoDraft.y2 = y; }
    drawAnno_(media);
  };
  svg.onpointerup = ()=>{
    if(annoMove){
      const mv = annoMove; annoMove = null;
      const m = media.marks[mv.i];
      if(mv.moved) saveState(); else openTextEditor_(media, m.x, m.y, m.c, mv.i);
      return;
    }
    if(!annoDraft) return;
    const d = annoDraft; annoDraft = null;
    const tiny = d.t === 'pen' ? d.pts.length < 2 : (Math.abs(d.x2-d.x1) + Math.abs(d.y2-d.y1) < 0.01);
    if(!tiny){ (media.marks = media.marks || []).push(d); saveState(); }
    drawAnno_(media);
  };
}

function downloadAnnotated_(media){
  const img = new Image();

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${(media.marks||[]).map(m=>shapeSvg_(m,W,H)).join('')}</svg>`;
      const ov = new Image();
      ov.onload = ()=>{
        const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0); ctx.drawImage(ov, 0, 0);
        cv.toBlob(b=>{
          const u = URL.createObjectURL(b), a = document.createElement('a');
          a.href = u; a.download = (media.url.split('/').pop()).replace(/\.\w+$/, '') + '_표시.jpg';
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=> URL.revokeObjectURL(u), 3000);
        }, 'image/jpeg', 0.9);
      };

}

/* ---- IndexedDB: 폴더 핸들 저장(세션 넘어 재사용) ---- */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('scout2_fs_' + (V2_PROJECT || '_none'), 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('handles');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise(res=>{
      const r = db.transaction('handles','readonly').objectStore('handles').get(key);
      r.onsuccess = ()=> res(r.result || null);
      r.onerror = ()=> res(null);
    });
  }catch(e){ return null; }
}
async function idbSet(key, val){
  try{
    const db = await idbOpen();
    await new Promise(res=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(val, key);
      tx.oncomplete = ()=> res(true);
      tx.onerror = ()=> res(false);
    });
  }catch(e){}
}

/* 🔴 폴더 권한은 «페이지를 열 때 미리» 메모리에 올려 둔다 (2026-10-09 대표 신고로 고침).
   왜 — 브라우저는 「방금 사람이 누른 직후」에만 폴더 창을 띄워준다. 버튼을 누른 «뒤에»
   저장소를 뒤지느라(await) 시간이 가면 그 «직후»가 끊겨서 창이 조용히 막히고,
   화면에는 「폴더 선택이 취소됐다」만 뜬다. 그래서 «누르기 전에» 미리 알아 둔다. */
let mediaDirHandle = null;
let mediaDirReady = false;     /* 동기적으로 판단해야 해서 따로 들고 있는다 */
(async function preloadMediaDir(){
  if(PUBLISHED) return;
  try{
    const h = await idbGet('mediaDir');
    if(h){
      /* 🔴 «저장돼 있던» 폴더도 이름을 다시 본다 — 전에 엉뚱한 폴더를 연결해 둔 채로 두면
         사진이 계속 그리로 저장되고 화면에는 안 보인다 (2026-10-09 실제로 그랬다). */
      if(h.name !== MEDIA_FOLDER.replace(/\/$/,'')){
        mediaDirHandle = null; mediaDirReady = false;
        await idbSet('mediaDir', null);
        setBackupStatus('off');
        return;
      }
      mediaDirHandle = h;
      mediaDirReady = (await h.queryPermission({mode:'readwrite'})) === 'granted';
    }
  }catch(e){}
})();

async function ensureMediaDirHandle(){
  if(!window.showDirectoryPicker){ alert(t('noFsApi')); return null; }
  if(mediaDirHandle){
    try{
      if(await mediaDirHandle.queryPermission({mode:'readwrite'}) === 'granted') return mediaDirHandle;
      if(await mediaDirHandle.requestPermission({mode:'readwrite'}) === 'granted') return mediaDirHandle;
    }catch(e){ mediaDirHandle = null; }
  }
  const saved = await idbGet('mediaDir');
  if(saved){
    try{
      let perm = await saved.queryPermission({mode:'readwrite'});
      if(perm !== 'granted') perm = await saved.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){ mediaDirHandle = saved; return saved; }
    }catch(e){}
  }
  try{
    const handle = await window.showDirectoryPicker({ id:'scoutMediaDirV2', mode:'readwrite' });
    mediaDirHandle = handle;
    await idbSet('mediaDir', handle);
    return handle;
  }catch(e){ return null; }
}

function makeImageThumbnailBlob(file){
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const maxW = 360;
      const scale = Math.min(1, maxW/img.width);
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(b=>{ URL.revokeObjectURL(url); resolve(b); }, 'image/jpeg', 0.82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
function makeVideoThumbnailBlob(file){
  return new Promise((resolve)=>{
    const video = document.createElement('video');
    video.preload = 'metadata'; video.muted = true; video.playsInline = true;
    const url = URL.createObjectURL(file);
    let done = false;
    const finish = (b)=>{ if(done) return; done = true; URL.revokeObjectURL(url); resolve(b); };
    video.addEventListener('loadeddata', ()=>{ video.currentTime = Math.min(1, (video.duration||2)/2); });
    video.addEventListener('seeked', ()=>{
      try{
        const w = 360, h = Math.round(360 * ((video.videoHeight/video.videoWidth)||0.75));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(video,0,0,w,h);
        canvas.toBlob(b=> finish(b), 'image/jpeg', 0.8);
      }catch(e){ finish(null); }
    });
    video.addEventListener('error', ()=> finish(null));
    setTimeout(()=> finish(null), 6000);
    video.src = url;
  });
}

async function handleBulkUpload(fileList){

     폴더는 버튼 단계에서 이미 연결돼 있어야 한다. */
  const dir = mediaDirReady ? mediaDirHandle : null;

  document.getElementById('uploadProgressTitle').textContent = t('uploadProgressTitle');
  document.getElementById('upProgressFill').style.width = '0%';
  document.getElementById('uploadProgressModal').classList.add('open');

  const newEntries = []; // {file,type,lat,lng}
  for(let i=0;i<files.length;i++){
    const f = files[i];
    setUploadProgress(i, files.length, f.name);
    const isVideo = f.type.startsWith('video/');
    const safeName = `up_${Date.now()}_${i}_${sanitizeFilename(f.name)}`;
    let lat = null, lng = null;
    if(!isVideo){
      try{ const gps = await exifr.gps(f); if(gps){ lat = gps.latitude; lng = gps.longitude; } }catch(e){}
    }
    try{
      await writeFileToDir(dir, '원본', safeName, f);
      const thumbBlob = isVideo ? await makeVideoThumbnailBlob(f) : await makeImageThumbnailBlob(f);
      const thumbName = safeName.replace(/\.[^.]+$/,'') + '.jpg';
      if(thumbBlob) await writeFileToDir(dir, '썸네일', thumbName, thumbBlob);
      newEntries.push({ file: safeName, type: isVideo?'video':'image', lat, lng });
    }catch(e){ /* 한 파일 실패해도 나머지는 계속 */ }
  }
  setUploadProgress(files.length, files.length, '');
  const extra = loadMediaExtra().concat(newEntries);
  saveMediaExtra(extra);

  document.getElementById('uploadProgressModal').classList.remove('open');
  if(!newEntries.length){
    alert('⚠ 올라간 파일이 없습니다.\n폴더 연결이 「' + MEDIA_FOLDER.slice(0,-1) + '」 인지 확인해주세요.');
    setBackupStatus('off');
    return;
  }
  const affectedIds = clusterAndAssign(newEntries);
  flashSaved();
  openReviewModal(affectedIds);
}

/* ---- GPS 자동분류: 기존 핀 근처면 그 핀에, 아니면 새로운 핀끼리 묶기, GPS 없으면 미분류 ---- */
function clusterAndAssign(newEntries){
  const affected = new Set();
  const withGps = [];
  const unsorted = loadUnsorted();

  newEntries.forEach(e=>{
    if(e.lat==null || e.lng==null){ unsorted.push(e); return; }
    let best = null, bestD = Infinity;
    LOCATIONS.forEach(loc=>{
      const d = haversineMeters(e.lat,e.lng, loc.lat, loc.lng);
      if(d < bestD){ bestD = d; best = loc; }
    });
    if(best && bestD <= CLUSTER_RADIUS_M){
      best.media.push({ type: e.type, url: mediaFullPath(e.file), caption:'' });
      affected.add(best.id);
    } else {
      withGps.push(e);
    }
  });

  // 남은 것들끼리 거리기준으로 묶기 (간단한 그리디 클러스터링)
  const clusters = [];
  withGps.forEach(e=>{
    let joined = null;
    for(const c of clusters){
      if(haversineMeters(e.lat,e.lng, c.lat, c.lng) <= CLUSTER_RADIUS_M){ joined = c; break; }
    }
    if(joined){
      joined.items.push(e);
      joined.lat = joined.items.reduce((s,x)=>s+x.lat,0)/joined.items.length;
      joined.lng = joined.items.reduce((s,x)=>s+x.lng,0)/joined.items.length;
    } else {
      clusters.push({ lat:e.lat, lng:e.lng, items:[e] });
    }
  });
  let clusterN = 1;
  clusters.forEach(c=>{
    const media = c.items.map(e=>({ type:e.type, url:mediaFullPath(e.file), caption:'' }));
    const loc = createLocationAt(c.lat, c.lng, { title: t('newClusterTitle')(clusterN++), media });
    affected.add(loc.id);
  });

  saveUnsorted(unsorted);
  applyFilter(); saveState(); refreshDistancesIfOpen();
  return affected;
}

    chip.title = (e.file || '') + ' — ' + t('reviewChipHint');

    const sunGrid = col.querySelector('.reviewZone.sun .reviewGrid');

    });

function makeReviewChip(type, thumbSrc, from, locId, idx, onOpen){
  const chip = document.createElement('div');
  chip.className = 'reviewChip';
  chip.draggable = true;
  chip.title = t('reviewChipHint');
  chip.innerHTML = `<img src="${thumbSrc}" alt=""><span class="rcType">${type==='video'?'🎬':(type==='sunseeker'?'☀️':'📷')}</span>`
    + `<span class="rcZoom">🔍</span>`;
  /* 🔴 더블클릭 = 크게 보기(영상은 재생). 끌어서 옮기기와 안 부딪힌다 */
  if(onOpen){
    chip.addEventListener('dblclick', (ev)=>{ ev.preventDefault(); ev.stopPropagation(); onOpen(); });
    const z = chip.querySelector('.rcZoom');
    z.addEventListener('click', (ev)=>{ ev.preventDefault(); ev.stopPropagation(); onOpen(); });
    z.draggable = false;
  }
  chip.addEventListener('dragstart', (ev)=>{
    dragPayload = { from, locId, idx };
    chip.classList.add('dragging');
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', 'x');
  });
  chip.addEventListener('dragend', ()=> chip.classList.remove('dragging'));
  return chip;
}
function bindDropzone(col, zoneLocId){
  col.addEventListener('dragover', (ev)=>{ ev.preventDefault(); if(zoneLocId!=null) ev.stopPropagation(); col.classList.add('dragover'); });
  col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
  col.addEventListener('drop', (ev)=>{
    ev.preventDefault();
    col.classList.remove('dragover');
    if(zoneLocId != null){   /* 구역(Sunseeker/사진)에 놓음 — 칸 전체 drop 은 안 돌게 */
      ev.stopPropagation();
      const colEl = col.closest('.reviewCol'); if(colEl) colEl.classList.remove('dragover');
      if(!dragPayload) return;
      moveReviewItem(dragPayload, {target:'loc', locId:zoneLocId, kind:col.dataset.kind});
      dragPayload = null;
      return;
    }
    if(!dragPayload) return;
    moveReviewItem(dragPayload, col.dataset.target==='unsorted' ? {target:'unsorted'} : {target:'loc', locId:Number(col.dataset.locId)});
    dragPayload = null;
  });
}
function moveReviewItem(src, dst){
  // 꺼내기
  let item = null, itemKind = null;
  if(src.from === 'unsorted'){
    const uns = loadUnsorted();
    item = uns[src.idx]; itemKind = 'raw';
    if(!item) return;
    uns.splice(src.idx,1); saveUnsorted(uns);
  } else {
    const loc = LOCATIONS.find(l=>l.id===src.locId);
    if(!loc) return;
    item = loc.media[src.idx]; itemKind = 'media';
    if(!item) return;
    loc.media.splice(src.idx,1);
  }
  // 넣기
  if(dst.target === 'unsorted'){
    const uns = loadUnsorted();
    if(itemKind === 'media'){
      const fname = item.url.split('/').pop();
      uns.push(Object.assign({ file:fname, type:item.type, lat:null, lng:null }, item.sun ? { sun:true } : {}));
    } else {
      uns.push(item);
    }
    saveUnsorted(uns);
  } else {
    const loc = LOCATIONS.find(l=>l.id===dst.locId);
    if(!loc) return;
    let added;
    if(itemKind === 'raw'){
      added = { type: item.type, url: item.url || mediaFullPath(item.file), caption: item.caption || '' };
      if(item.thumb) added.thumb = item.thumb; if(item.drive) added.drive = item.drive; if(item.marks) added.marks = item.marks;
      if(item.sun) added.sun = true;
    } else {
      added = item;
    }
    /* ☀️ 「Sunseeker」 칸에 놓으면 Sunseeker, 「사진」 칸에 놓으면 일반 사진 (영상은 그대로) */
    if(added.type === 'video'){
      if(dst.kind) added.sun = (dst.kind === 'sun');
    } else {
      if(dst.kind === 'sun') added.type = 'sunseeker';
      else if(dst.kind === 'photo') added.type = 'image';
    }
    loc.media.push(added);
  }
  renderReviewModal(null);
  renderList(); renderPhotoGrid(); refreshDistancesIfOpen();
  if(currentLocId!=null) renderDpMedia(LOCATIONS.find(l=>l.id===currentLocId) || {media:[]});
  saveState();
}

/* =========================================================
   9-B. 드라이브 폴더 자동 백업 — 크롬 저장소가 날아가도 살아남게
   🔴 브라우저는 아무 폴더에나 못 쓴다. 사진 업로드 때 받아둔 «그 폴더 권한»을 그대로 쓴다.
   🔴 권한이 끊기면 «조용히» 넘어가지 않는다 — 화면에 꺼졌다고 띄우고 다시 연결할 단추를 준다.
   ========================================================= */
const BACKUP_FILENAME = '_백업_데이터.js';
let backupTimer = null, backupBusy = false;

let lastBackupStatus = null;
function setBackupStatus(kind, extra){
  lastBackupStatus = [kind, extra];
  const el = document.getElementById('backupStatus');
  if(!el) return;
  if(kind === 'ok'){
    el.innerHTML = (LANG==='en' ? '💾 Backed up to Drive · ' : '💾 드라이브 백업됨 · ') + extra;
    el.style.color = '#7ee787';
  } else if(kind === 'off'){
    el.innerHTML = LANG==='en' ? `⚠ Auto-backup off — <button id="btnBackupConnect" class="catEditBtn">Connect folder</button>`
                               : `⚠ 자동 백업 꺼짐 — <button id="btnBackupConnect" class="catEditBtn">폴더 연결</button>`;
    el.style.color = 'var(--accent)';
    const b = document.getElementById('btnBackupConnect');
    if(b) b.onclick = ()=> connectMediaFolder();
  } else {
    el.innerHTML = LANG==='en' ? '⚠ Backup failed — check folder permission' : '⚠ 백업 실패 — 폴더 권한을 다시 확인해주세요';
    el.style.color = 'var(--danger)';
  }
}
function scheduleBackup(){
  if(PUBLISHED) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(doBackup, 2500);   /* 손이 멈춘 뒤 한 번만 */
}
async function doBackup(){
  if(PUBLISHED || backupBusy) return;
  backupBusy = true;
  try{
    let dir = mediaDirHandle;
    if(!dir) dir = await idbGet('mediaDir');
    if(!dir){ setBackupStatus('off'); return; }
    /* 🔴 권한 «재요청»은 사람이 누를 때만 된다 — 여기서는 확인만 하고, 없으면 단추를 띄운다 */
    if(await dir.queryPermission({mode:'readwrite'}) !== 'granted'){ setBackupStatus('off'); return; }
    mediaDirHandle = dir;
    const bundle = {
      savedAt: new Date().toISOString(),
      locations: LOCATIONS,
      categories: CATEGORIES,
      mapTexts: MAP_TEXTS,
      gmapsKey: (localStorage.getItem(GMAPS_KEY_STORAGE) || '')
    };
    const fh = await dir.getFileHandle(BACKUP_FILENAME, { create:true });
    const w = await fh.createWritable();
    await w.write('const LOCATIONS = ' + JSON.stringify(bundle, null, 2) + ';');
    await w.close();
    const d = new Date();
    setBackupStatus('ok', `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);
  }catch(e){
    setBackupStatus('fail');
  }finally{ backupBusy = false; }
}
if(!PUBLISHED) setTimeout(doBackup, 1200);   /* 열자마자 한 번 — 상태를 바로 보여준다 */

/* 🔴 업로드는 «두 걸음»이다 — ①폴더 연결 ②파일 고르기.
   한 번에 하면 브라우저가 폴더 창을 막는다(위 preloadMediaDir 주석 참고).
   폴더가 이미 연결돼 있으면 ①을 건너뛰고 바로 파일 창이 열린다. */
function connectMediaFolder(onDone){
  /* 🔴 이 함수는 «클릭 핸들러 안에서 곧바로» 불려야 한다 — 앞에 await 를 두면 안 된다 */
  let p;
  try{
    p = mediaDirHandle
      ? mediaDirHandle.requestPermission({mode:'readwrite'})
      : (window.showDirectoryPicker
          ? window.showDirectoryPicker({ id:'scoutMediaDirV2', mode:'readwrite' })
          : Promise.reject(new Error('no-fs-api')));
  }catch(e){ p = Promise.reject(e); }

  p.then(async (res)=>{
    if(typeof res === 'string'){
      if(res !== 'granted'){ setBackupStatus('off'); flashError(t('folderPickCancelled')); return; }
    } else if(res){
      /* 🔴 폴더를 «잘못 고르면» 사진이 엉뚱한 데 저장돼 화면에 안 보인다 (2026-10-09 실제로 겪음 —
         대표님이 원본이 있던 다운로드 폴더를 고르셨고, 업로드가 조용히 실패했다).
         이 페이지는 사진을 «이 폴더 이름»으로만 찾으므로, 이름이 다르면 받지 않는다. */
      if(res.name !== MEDIA_FOLDER.replace(/\/$/,'')){
        alert(t('folderWrong')(res.name));
        setBackupStatus('off');
        return;
      }
      mediaDirHandle = res;
      await idbSet('mediaDir', res);
    }
    mediaDirReady = true;
    doBackup();
    if(onDone) onDone();
  }).catch((e)=>{
    if(String(e && e.message) === 'no-fs-api'){ alert(t('noFsApi')); return; }
    setBackupStatus('off');
    flashError(t('folderPickCancelled'));
  });
}

/* (261009 답사 전용 «한 번만» 고침들은 V2 에서 뺐다 — 원본 편집본에만 있다) */
/* =========================================================
   💬 V2 — 보는 사람들의 사진·댓글 (2026-10-09 대표 확정: 입장 코드 · 올리면 바로 보임)
   · 보는 쪽(공개 링크): SCOUT_PUBLISHED.v2 = {api, p, code, feed} 를 로더가 넣어준다
   · 편집 쪽(맥): 같은 폴더의 「_관리자키.html」 을 읽어 관리자 키로 붙는다 — 지우기 단추가 생긴다
   🔴 사진은 브라우저에서 긴 변 1600px JPEG 로 줄여서 보낸다(폰 원본 그대로면 느리고 서버 한도에 걸린다)
   ========================================================= */
/* 🔒 2026-10-09 대표 지시 「관리자만 사진 올릴 수 있고 코멘트는 일단 빼자」 — 보는 사람의 사진·댓글 칸을 끈다(서버도 거절).
   다시 켜려면 true + 서버 스크립트 속성 FEED_ON='1'. */
const V2_FEED_ON = false;
const V2_API = 'https://script.google.com/macros/s/AKfycbzgj1gQlGiTNAUhF5FqLKJ11oAbq3lmjBvZKei3IkFUnFLEdQogRIFk_SuVUK8RFs4F2g/exec';
var V2 = {   /* var — 위쪽 코드가 처음 그릴 때 먼저 불러도 멈추지 않게(아직 undefined 일 뿐) */
  api: (PUBLISHED && PUBLISHED.v2 && PUBLISHED.v2.api) || V2_API,
  p: V2_PROJECT, code: (PUBLISHED && PUBLISHED.v2 && PUBLISHED.v2.code) || '', admin: '',
  feed: (PUBLISHED && PUBLISHED.v2 && PUBLISHED.v2.feed) || [], on: !!(PUBLISHED && PUBLISHED.v2),
  pw: (PUBLISHED && PUBLISHED.v2 && PUBLISHED.v2.pw) || '', rev: (PUBLISHED && PUBLISHED.v2 && Number(PUBLISHED.v2.rev)) || 0,
  ready: false, saving: false, dirty: false, timer: null
};
async function v2Call(body){
  const r = await fetch(V2.api, { method:'POST', body: JSON.stringify(body) });   /* text/plain → 사전요청 없이 간다 */
  const j = await r.json();
  if(!j.ok) throw new Error(j.err || 'fail');
  return j;
}
function v2Auth(extra){ return Object.assign(V2.admin ? { key: V2.admin } : { code: V2.code, pw: V2.pw }, { p: V2.p }, extra || {}); }
/* ☁️ 관리자 웹 편집 — 고칠 때마다 1.2초 모았다가 서버에 통째로 저장. 다른 관리자가 먼저 저장했으면(rev 다름) 덮지 않고 알린다 */
function v2Project(){
  return { title: PUBLISHED.title || '', subtitle: PUBLISHED.subtitle || '', locations: LOCATIONS, categories: CATEGORIES,
           mapTexts: (typeof MAP_TEXTS !== 'undefined') ? MAP_TEXTS : [], unsorted: PUBLISHED.unsorted || [], archive: PUBLISHED.archive || [], libMigrated: !!PUBLISHED.libMigrated };
}
function v2Toast(msg, kind){ const el = document.getElementById('saveToast'); el.textContent = msg; el.className = 'toast show ' + (kind || 'ok'); clearTimeout(saveToastTimer); if(kind !== 'wait') saveToastTimer = setTimeout(()=> el.classList.remove('show'), kind === 'err' ? 6000 : 1400); }
function v2SaveSoon(){
  if(!V2EDIT || !V2 || !V2.ready) return;
  V2.dirty = true; clearTimeout(V2.timer); V2.timer = setTimeout(v2SaveNow, 1200);
}
async function v2SaveNow(){
  if(!V2.dirty) return;
  if(V2.saving){ V2.timer = setTimeout(v2SaveNow, 800); return; }
  V2.saving = true; V2.dirty = false; v2Toast('⏳ ' + t('v2Saving'), 'wait');
  try{
    const r = await fetch(V2.api, { method:'POST', body: JSON.stringify(v2Auth({ action:'editSave', project: v2Project(), rev: V2.rev })) });
    const j = await r.json();
    if(j.ok){ V2.rev = j.rev; v2Toast('☁️ ' + t('v2Saved'), 'ok'); }
    else if(j.err === 'conflict'){ V2.dirty = false; v2Toast('⚠ ' + t('v2Conflict'), 'err'); if(confirm(t('v2Conflict') + '\n\n' + t('v2ReloadQ'))) location.reload(); }
    else { V2.dirty = true; v2Toast('⚠ ' + t('v2SaveFail') + ' (' + j.err + ')', 'err'); }
  }catch(e){ V2.dirty = true; v2Toast('⚠ ' + t('v2SaveFail'), 'err'); }
  V2.saving = false;
}

function v2Name(){

async function v2Shrink(file){
  /* 긴 변 1600px JPEG 로 — 사진 방향(EXIF)도 바르게 */
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85));
  const b64 = await new Promise(res=>{ const fr = new FileReader(); fr.onload = ()=> res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
  return b64;
}

/* 📷 관리자 올리기 — 지금 열린 스팟의 «미디어»로 바로 들어간다(사진 1600px JPEG · 영상은 30MB 이하 원본) */
async function v2Thumb(fileOrBlob, isVideo){
  let src;
  if(isVideo){
    const url = URL.createObjectURL(fileOrBlob), v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
    await new Promise((res, rej)=>{ v.onloadeddata = res; v.onerror = rej; setTimeout(res, 8000); });
    try{ v.currentTime = Math.min(1, (v.duration || 2) / 2); await new Promise(res=>{ v.onseeked = res; setTimeout(res, 3000); }); }catch(e){}
    src = v;
  } else {
    src = await createImageBitmap(fileOrBlob, { imageOrientation: 'from-image' });
  }
  const w = src.videoWidth || src.width, h = src.videoHeight || src.height;
  const sc = Math.min(1, 480 / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * sc)); cv.height = Math.max(1, Math.round(h * sc));
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.8));
  return await new Promise(res=>{ const fr = new FileReader(); fr.onload = ()=> res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
}
function v2B64(file){ return new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=> res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); }); }

function upShow(i, n, name){
  const b = document.getElementById('upBlock'); b.classList.add('open'); b.classList.remove('done');
  document.getElementById('upTitle').textContent = '⏳ ' + t('v2Uploading') + ' (' + (i + 1) + '/' + n + ')';
  document.getElementById('upFile').textContent = name || '';
  document.getElementById('upBarIn').style.width = Math.round(i / n * 100) + '%';
  document.getElementById('upNote').textContent = t('upNote');
}
function upDone(msg, isErr){
  const b = document.getElementById('upBlock'); b.classList.add('done');
  document.getElementById('upTitle').textContent = msg;
  document.getElementById('upFile').textContent = ''; document.getElementById('upNote').textContent = '';

  setTimeout(()=> b.classList.remove('open'), isErr ? 2500 : 1200);
}
async function v2UploadFiles(files, put){
  let ok = 0, fail = [];
  V2.uploading = true;
  for(let i = 0; i < files.length; i++){
    const f = files[i], isVideo = /^video\//.test(f.type);
    upShow(i, files.length, f.name);
    try{
      if(isVideo && f.size > 30 * 1024 * 1024){ fail.push(f.name + ' — ' + t('v2VideoTooBig')); continue; }
      const thumb = await v2Thumb(f, isVideo);
      const tid = (await v2Call(v2Auth({ action:'editUpload', data: thumb, mime:'image/jpeg', fname:'썸네일_' + f.name.replace(/\.[^.]+$/, '') + '.jpg' }))).file;
      if(isVideo){
        const vid = (await v2Call(v2Auth({ action:'editUpload', data: await v2B64(f), mime: f.type || 'video/mp4', fname: f.name }))).file;
        put({ type:'video', drive: vid, url: v2Img(tid, 1600), thumb: v2Img(tid, 480), caption:'', file: f.name });
      } else {
        const fid = (await v2Call(v2Auth({ action:'editUpload', data: await v2Shrink(f), mime:'image/jpeg', fname: f.name.replace(/\.[^.]+$/, '') + '.jpg' }))).file;
        put({ type:'image', url: v2Img(fid, 1600), thumb: v2Img(tid, 480), caption:'', file: f.name });
      }
      ok++;
    }catch(e){ fail.push(f.name + ' — ' + (e.message || 'fail')); }
  }
  V2.uploading = false;
  if(fail.length){ upDone('⚠ ' + t('v2UploadFail')(fail.length), true); setTimeout(()=> alert(t('v2UploadFail')(fail.length) + '\n\n' + fail.join('\n')), 300); }
  else upDone('✓ ' + t('v2Uploaded')(ok));
}
