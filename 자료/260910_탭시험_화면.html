<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험용 화면</title>
<!-- 🧪 2026-09-10 — 탭 시험이 여는 «가짜 앱» 화면. 회사 정보 0. 아무것도 안 바꾼다. -->
<style>
  body{ margin:0; background:#20293a; color:#eceff4; min-height:100vh;
        font:16px/1.6 -apple-system,"Apple SD Gothic Neo",BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        display:flex; align-items:center; justify-content:center; padding:22px; }
  .box{ max-width:420px; width:100%; text-align:center; }
  .who{ font-size:34px; margin-bottom:2px; }
  h1{ font-size:22px; margin:4px 0 20px; letter-spacing:-.4px; }
  .cnt{ background:#fff; color:#1c2330; border-radius:16px; padding:22px 16px; margin:0 0 16px; }
  .n{ font-size:52px; font-weight:900; line-height:1.05; letter-spacing:-2px; }
  .n.ok{ color:#2f8f5b; }
  .n.no{ color:#c0392b; }
  .lb{ font-size:15px; color:#6b7280; margin-top:5px; }
  .verdict{ font-size:16px; font-weight:800; margin-top:12px; letter-spacing:-.3px; }
  .t{ font-size:13px; color:#a9b4c6; margin:2px 0 0; }
  a.btn{ display:block; background:#455a64; color:#fff; text-decoration:none; border-radius:12px;
         font-size:17px; font-weight:800; padding:15px; margin-top:8px; letter-spacing:-.3px; }
</style>
</head>
<body>
<div class="box">
  <div class="who" id="ico">🎬</div>
  <h1 id="nm">장비앱 (시험용)</h1>

  <div class="cnt">
    <div class="n" id="n">1</div>
    <div class="lb">번째로 <b>새로 열렸습니다</b></div>
    <div class="verdict" id="v"></div>
  </div>

  <p class="t" id="t"></p>
  <a class="btn" href="260910_탭시험.html">⬅ 시험으로 돌아가기</a>
</div>

<script>
/* 🔴 sessionStorage 는 «그 탭»의 것이다. 탭이 다시 쓰이면 값이 남고, 새 탭이면 1부터 시작한다.
   🔴 그런데 «같은 탭이라도 주소를 다시 주면» 페이지는 다시 읽힌다 —
      그때도 이 숫자는 늘어난다. 그래서 숫자가 «늘어난다 = 3초를 또 쓴다»는 뜻이다. */
var q = (location.search.match(/who=([^&]*)/) || [])[1] || 'field';
q = decodeURIComponent(q);
if (q === 'quote') {
  document.getElementById('ico').textContent = '🧾';
  document.getElementById('nm').textContent  = '견적서 (시험용)';
}
var KEY = 'patab_' + q, n = 1;
try { n = (parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0) + 1;
      sessionStorage.setItem(KEY, String(n)); } catch (e) {}

var el = document.getElementById('n');
el.textContent = n;
el.className = 'n ' + (n === 1 ? 'no' : 'ok');

document.getElementById('v').innerHTML = (n === 1)
  ? '🔴 <b>이번에 새로 열렸습니다</b><br><span style="font-weight:600;color:#6b7280">' +
    '(처음이면 정상입니다 — 돌아가서 한 번 더 눌러보세요)</span>'
  : '🔴 <b>또 새로 열렸습니다 — 3초가 또 들었습니다</b><br>' +
    '<span style="font-weight:600;color:#6b7280">탭은 하나여도 «다시 읽는» 것입니다</span>';

try {
  var d = new Date();
  document.getElementById('t').textContent =
    '열린 시각 ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2)
    + ':' + ('0'+d.getSeconds()).slice(-2);
} catch (e) {}

/* ⚡ 「주소 없이 전환」으로 왔을 때 — 이 글자가 바뀌면 «다시 안 읽고» 온 것이다(0초). */
window.addEventListener('message', function (ev) {
  if (!ev || !ev.data || ev.data.pa !== 'switch') return;
  document.getElementById('v').innerHTML =
    '✅ <b>다시 안 읽고 «그대로» 왔습니다 — 0초!</b><br>' +
    '<span style="font-weight:600;color:#6b7280">이게 되면 앱 여는 3초가 사라집니다</span>';
  document.getElementById('n').className = 'n ok';
  try { document.getElementById('t').textContent += '  ·  전환 ' + new Date().toLocaleTimeString('ko-KR'); } catch (e) {}
});
</script>
</body>
</html>
