<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정산앱 사용법</title>
<style>
  :root{--bg:#f7f8fa;--card:#fff;--ink:#1c2330;--sub:#5b6472;--line:#e5e8ee;--accent:#3b6cff;--accent-soft:#eaf0ff}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171d2b;--ink:#e8ecf4;--sub:#a2acbe;--line:#28303f;--accent:#7aa2ff;--accent-soft:#1b2540}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;font-size:17px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:32px 26px;max-width:460px;width:100%;text-align:center}
  h1{font-size:23px;margin:0 0 10px;letter-spacing:-.4px}
  p{color:var(--sub);font-size:15.5px;margin:0 0 6px}
  .big{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;
    font-size:18px;padding:16px;border-radius:13px;margin:22px 0 10px}
  .big span{display:block;font-size:13px;font-weight:600;opacity:.9;margin-top:4px}
  .how{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-top:18px;font-size:14.5px;line-height:1.85}
  .how b{color:var(--ink)}
  .foot{font-size:12.5px;color:var(--sub);margin-top:18px}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:44px;line-height:1">💰</div>
  <h1>정산앱 사용법</h1>
  <p>이 안내는 <b>앱 안으로 옮겼습니다.</b><br>앱에서 <b>「?」</b> 를 누르면 언제든 볼 수 있습니다.</p>

  <a class="big" href="https://luvparklife.github.io" target="_top">
    허브 열기 →<span>구글 로그인 → 「정산앱」 카드</span></a>

  <div class="how">
    <b>왜 옮겼나</b><br>
    문서를 따로 두면 앱을 고칠 때마다 안내가 뒤처집니다.
    앱 안에 두면 <b>고치는 자리가 한 곳</b>이라 어긋날 수가 없습니다.
    <br><br>
    <b>앱에서 보는 법</b><br>
    허브에서 <b>「💰 정산앱」</b> 카드를 누르고, 화면 오른쪽 위 <b>「?」</b> 를 누르세요.<br>로그인 전이라도 화면에 <b>무엇을 준비해야 하는지</b>가 그대로 보입니다.
  </div>

  <div class="foot">촬영 프로덕션 PA · 2026-08-20</div>
</div>
</body>
</html>
